{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend
  labels:
    {{- include "monad-indexer.backend.labels" . | nindent 4 }}
  {{- if .Values.backend.service.annotations }}
  annotations:
    {{- toYaml .Values.backend.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  {{- if and .Values.backend.service.clusterIP (eq .Values.backend.service.type "ClusterIP") }}
  clusterIP: {{ .Values.backend.service.clusterIP }}
  {{- end }}
  {{- if and .Values.backend.service.loadBalancerIP (eq .Values.backend.service.type "LoadBalancer") }}
  loadBalancerIP: {{ .Values.backend.service.loadBalancerIP }}
  {{- end }}
  {{- if and .Values.backend.service.loadBalancerSourceRanges (eq .Values.backend.service.type "LoadBalancer") }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.backend.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and .Values.backend.service.externalTrafficPolicy (or (eq .Values.backend.service.type "LoadBalancer") (eq .Values.backend.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.backend.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.backend.service.sessionAffinity }}
  sessionAffinity: {{ .Values.backend.service.sessionAffinity }}
  {{- end }}
  {{- if .Values.backend.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml .Values.backend.service.sessionAffinityConfig | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (or (eq .Values.backend.service.type "NodePort") (eq .Values.backend.service.type "LoadBalancer")) .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
    {{- if .Values.backend.service.extraPorts }}
    {{- toYaml .Values.backend.service.extraPorts | nindent 4 }}
    {{- end }}
  selector:
    {{- include "monad-indexer.backend.selectorLabels" . | nindent 4 }}
{{- end }}
