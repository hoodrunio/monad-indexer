# ArgoCD Application - Cilium CNI
# Manages Cilium installation via GitOps

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  # Install before other apps
spec:
  project: infrastructure

  # Multi-source configuration
  sources:
    # Source 1: ExternalSecret for API server configuration
    # This must be deployed first (sync-wave: -10) to create the secret
    # that Cilium will use for k8sServiceHost
    - repoURL: https://github.com/hoodrunio/monad-indexer.git
      targetRevision: HEAD
      path: infrastructure/helm/cilium
      directory:
        include: "api-server-config-secret.yaml"

    # Source 2: Cilium Helm chart
    - repoURL: https://helm.cilium.io/
      targetRevision: 1.18.3
      chart: cilium
      helm:
        valueFiles:
          - $values/infrastructure/helm/cilium/values.yaml
        # k8sServiceHost is now fetched from AWS Secrets Manager via ExternalSecret
        # No need for hardcoded parameters anymore

    # Source 3: Values repository reference
    - repoURL: https://github.com/hoodrunio/monad-indexer.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: false  # Don't auto-prune CNI resources (dangerous)
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # kube-system already exists
      - ServerSideApply=true   # Required for CRDs
      - RespectIgnoreDifferences=true

  # Health check configuration
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/debug  # Ignore debug flag changes

---
# ArgoCD Application - Cilium LoadBalancer IP Pool
# Manages LoadBalancer IP pool for bare metal

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-lb-ippool
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-4"  # Install after Cilium
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/hoodrunio/monad-indexer.git
    targetRevision: HEAD
    path: infrastructure/helm/cilium

    # Only sync the lb-ippool.yaml file
    directory:
      include: "lb-ippool.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    # Wait for Cilium to be ready before syncing IP pool
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
