---
# Gateway - Development environment gateway for monad-indexer
# Listens on public IP (65.21.183.30) for HTTP and HTTPS traffic
# Domain: monad-tn1-indexer.hoodscan.io

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monad-indexer-gateway
  namespace: monad-indexer-dev
  labels:
    gateway: monad-indexer
    environment: dev
  annotations:
    # Cilium LoadBalancer pool selector - uses public IP pool
    io.cilium/lb-ipam-ips: "65.21.183.30"
spec:
  gatewayClassName: cilium

  listeners:
    # HTTP listener - allows cert-manager HTTP-01 challenges and traffic
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.hoodscan.io"  # Wildcard for all subdomains
      allowedRoutes:
        namespaces:
          from: All  # Allow from all namespaces (cert-manager needs this)

  # Address configuration - request public IP from LoadBalancer pool
  addresses:
    - type: IPAddress
      value: "65.21.183.30"
