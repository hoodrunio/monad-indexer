{{- if .Values.gateway.enabled -}}
---
# HTTPRoute - Routes HTTP traffic to backend service
# Replaces Ingress resource with Gateway API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.backend.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Attach to the Gateway
  parentRefs:
    - name: {{ .Values.gateway.name }}
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- else }}
      namespace: {{ .Release.Namespace }}
      {{- end }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName }}  # Configurable HTTPS listener name
      {{- end }}

  # Hostname matching
  hostnames:
    {{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
    {{- end }}

  # Routing rules
  rules:
    {{- range .Values.gateway.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType }}
            value: {{ .path }}
      backendRefs:
        - name: {{ include "monad-indexer.fullname" $ }}-backend
          port: {{ $.Values.backend.service.port }}
          weight: 100
      {{- if $.Values.gateway.timeout }}
      timeouts:
        request: {{ $.Values.gateway.timeout }}
      {{- end }}
      {{- if $.Values.gateway.retries }}
      filters:
        - type: RequestRetry
          requestRetry:
            attempts: {{ $.Values.gateway.retries.attempts }}
            backoff: {{ $.Values.gateway.retries.backoff }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
