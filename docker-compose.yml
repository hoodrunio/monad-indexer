# Monad Testnet Indexer - Full Stack
# This is the all-in-one configuration including all services
# For modular deployment, see docker-compose.*.yml files

# Usage:
#   Full stack:     docker compose up -d
#   Minimal:        docker compose -f docker-compose.base.yml -f docker-compose.backend.yml up -d
#   With stats:     docker compose -f docker-compose.base.yml -f docker-compose.backend.yml -f docker-compose.stats.yml up -d
#   Everything:     docker compose -f docker-compose.base.yml -f docker-compose.backend.yml -f docker-compose.microservices.yml -f docker-compose.stats.yml up -d

include:
  - docker-compose.base.yml
  - docker-compose.backend.yml
  - docker-compose.microservices.yml
  - docker-compose.stats.yml
