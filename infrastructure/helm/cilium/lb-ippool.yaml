# CiliumLoadBalancerIPPool - IP Pool for LoadBalancer Services
# Defines the IP range that Cilium will assign to LoadBalancer services
#
# This replaces MetalLB/ServiceLB for bare metal Kubernetes clusters
# IPs are announced via L2 (ARP/NDP) by default

apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: monad-indexer-pool
spec:
  # CIDR block for LoadBalancer IPs
  # Range: 10.0.0.100 - 10.0.0.131 (32 addresses)
  blocks:
    - cidr: "10.0.0.100/27"

  # Service selector - only apply to monad-indexer services
  # Remove or modify to apply to all services
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: monad-indexer

---
# CiliumL2AnnouncementPolicy - L2 announcement configuration
# Defines how IPs are announced on the local network

apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: monad-indexer-l2-policy
spec:
  # Use all network interfaces for announcements
  # Modify if you want to restrict to specific interfaces (e.g., eth0, ens192)
  interfaces:
    - ^eth[0-9]+
    - ^ens[0-9]+
    - ^enp[0-9]+s[0-9]+

  # Load balancer IP pool to announce
  loadBalancerIPs: true

  # Service selector - match services from the IP pool
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: monad-indexer

  # Node selector - which nodes should announce IPs
  # Empty means all nodes can announce (recommended for HA)
  nodeSelector:
    matchLabels: {}

---
# Example: IP Pool for all services (global)
# Uncomment if you want a global IP pool instead of app-specific

