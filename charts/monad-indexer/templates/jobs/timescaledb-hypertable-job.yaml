{{- if and .Values.postgresql.enabled .Values.postgresql.timescaledb.enabled .Values.postgresql.timescaledb.setupJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monad-indexer.fullname" . }}-timescaledb-hypertable
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.postgresql.timescaledb.setupJob.backoffLimit | default 5 }}
  activeDeadlineSeconds: {{ .Values.postgresql.timescaledb.setupJob.timeoutSeconds | default 600 }}
  template:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: timescaledb-setup
    spec:
      serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- with .Values.postgresql.timescaledb.setupJob.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.timescaledb.setupJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: setup-timescaledb-hypertable
        image: {{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: {{ include "monad-indexer.fullname" . }}-postgresql-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: password
        - name: WAIT_FOR_TABLE_TIMEOUT
          value: {{ .Values.postgresql.timescaledb.setupJob.waitForTableTimeout | default "300" | quote }}
        - name: WAIT_FOR_TABLE_INTERVAL
          value: {{ .Values.postgresql.timescaledb.setupJob.waitForTableInterval | default "5" | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "================================================================"
          echo "TIMESCALEDB HYPERTABLE SETUP"
          echo "================================================================"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Database: ${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "================================================================"

          # Wait for database to be ready
          echo ">>> Waiting for database to be ready..."
          max_attempts=30
          attempt=0
          until psql -c "SELECT 1" > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Waiting for database... attempt $attempt/$max_attempts"
            sleep 2
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Database not available after $max_attempts attempts"
            exit 1
          fi

          echo ">>> Database is ready!"

          # Wait for transactions table to be created by Blockscout migrations
          echo ">>> Waiting for transactions table to be created by Blockscout migrations..."
          timeout=${WAIT_FOR_TABLE_TIMEOUT}
          interval=${WAIT_FOR_TABLE_INTERVAL}
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            if psql -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'transactions');" | grep -q 't'; then
              echo ">>> Transactions table found!"
              break
            fi
            echo "Waiting for transactions table... elapsed ${elapsed}s / ${timeout}s"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "ERROR: Transactions table not found after ${timeout}s timeout"
            echo "This usually means Blockscout migrations haven't run yet."
            echo "Please check backend pod logs for migration status."
            exit 1
          fi

          # Verify TimescaleDB extension is loaded
          echo ">>> Verifying TimescaleDB extension..."
          if ! psql -t -c "SELECT COUNT(*) FROM pg_extension WHERE extname = 'timescaledb';" | grep -q '1'; then
            echo "ERROR: TimescaleDB extension not found!"
            echo "Please ensure TimescaleDB is properly installed and loaded."
            exit 1
          fi

          echo ">>> TimescaleDB extension verified!"

          # Check if transactions table is already a hypertable
          echo ">>> Checking if transactions table is already a hypertable..."
          if psql -t -c "SELECT COUNT(*) FROM timescaledb_information.hypertables WHERE hypertable_schema = 'public' AND hypertable_name = 'transactions';" | grep -q '1'; then
            echo ""
            echo "================================================================"
            echo "INFO: Transactions table is already a TimescaleDB hypertable"
            echo "Skipping hypertable creation (idempotent check)"
            echo "================================================================"

            # Show current hypertable stats
            echo ""
            echo ">>> Current hypertable statistics:"
            psql -c "SELECT hypertable_schema, hypertable_name, num_chunks FROM timescaledb_information.hypertables WHERE hypertable_name = 'transactions';"

            echo ""
            echo "================================================================"
            echo "SUCCESS: TimescaleDB setup already complete"
            echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "================================================================"
            exit 0
          fi

          echo ">>> Transactions table exists but is not yet a hypertable. Proceeding with conversion..."

          # Execute TimescaleDB setup SQL from ConfigMap
          echo ">>> Running TimescaleDB setup script from ConfigMap..."
          echo ">>> This will convert the transactions table to a hypertable and may take several minutes..."

          if psql -v ON_ERROR_STOP=1 -f /mnt/sql/timescaledb_setup.sql; then
            echo ""
            echo "================================================================"
            echo "SUCCESS: TimescaleDB hypertable setup completed successfully!"
            echo "================================================================"

            # Show final hypertable stats
            echo ""
            echo ">>> Final hypertable statistics:"
            psql -c "SELECT hypertable_schema, hypertable_name, num_chunks FROM timescaledb_information.hypertables WHERE hypertable_name = 'transactions';"

            echo ""
            echo ">>> Compression settings:"
            psql -c "SELECT * FROM timescaledb_information.compression_settings WHERE hypertable_name = 'transactions';"

            echo ""
            echo "================================================================"
            echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "================================================================"
            exit 0
          else
            echo ""
            echo "================================================================"
            echo "ERROR: Failed to run TimescaleDB setup script"
            echo "Failed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "================================================================"
            exit 1
          fi

        volumeMounts:
        - name: timescaledb-setup-sql
          mountPath: /mnt/sql
          readOnly: true
        {{- with .Values.postgresql.timescaledb.setupJob.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: timescaledb-setup-sql
        configMap:
          name: {{ include "monad-indexer.fullname" . }}-timescaledb-setup
{{- end }}
