{{- if and .Values.backend.enabled (not .Values.backend.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend-secret
  labels:
    {{- include "monad-indexer.backend.labels" . | nindent 4 }}
  {{- if .Values.backend.secret.annotations }}
  annotations:
    {{- toYaml .Values.backend.secret.annotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  database-url: {{ include "monad-indexer.postgresql.connectionString" . | quote }}
  # IMPORTANT: Replace this placeholder with a real secret key in production
  # For Sealed Secrets: Generate with `mix phx.gen.secret` and seal with kubeseal
  # Example: echo -n "your-secret-key" | kubeseal --raw --from-file=/dev/stdin --namespace=default --name=monad-indexer-backend-secret --scope=strict
  secret-key-base: {{ .Values.backend.secret.secretKeyBase | default "changeme-generate-with-mix-phx-gen-secret" | quote }}
{{- end }}
