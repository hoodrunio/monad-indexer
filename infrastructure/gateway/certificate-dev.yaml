---
# Certificate - TLS certificate for monad-indexer dev environment
# cert-manager will automatically issue and renew this certificate from Let's Encrypt

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monad-tn1-indexer-tls
  namespace: monad-indexer-dev
  labels:
    app.kubernetes.io/name: monad-indexer
    environment: dev
spec:
  # Secret name where the certificate will be stored
  secretName: monad-tn1-indexer-tls

  # Certificate details
  commonName: monad-tn1-indexer.hoodscan.io
  dnsNames:
    - monad-tn1-indexer.hoodscan.io

  # Issuer reference
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  # Certificate renewal (90 days, renew at 60 days)
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry

  # Private key configuration
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  # Usages
  usages:
    - digital signature
    - key encipherment
    - server auth
