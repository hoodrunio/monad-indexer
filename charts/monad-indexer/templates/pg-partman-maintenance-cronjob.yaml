{{- if .Values.postgresql.partman.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "monad-indexer.fullname" . }}-pg-partman-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-partman-maintenance
spec:
  schedule: {{ .Values.postgresql.partman.maintenance.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Prevent overlapping maintenance runs
  startingDeadlineSeconds: 1800  # Allow 30 min late start
  jobTemplate:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: pg-partman-maintenance
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.postgresql.partman.maintenance.timeoutSeconds | default 3600 }}
      template:
        metadata:
          labels:
            {{- include "monad-indexer.labels" . | nindent 12 }}
            app.kubernetes.io/component: pg-partman-maintenance
        spec:
          serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- with .Values.postgresql.partman.maintenance.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgresql.partman.maintenance.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: pg-partman-maintenance
            image: {{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
            imagePullPolicy: IfNotPresent
            env:
            # Use CloudNativePG superuser secret for network connection
            # enableSuperuserAccess: true in cluster spec creates this secret automatically
            - name: PGHOST
              value: {{ include "monad-indexer.fullname" . }}-postgresql-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monad-indexer.fullname" . }}-postgresql-superuser
                  key: password
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "================================================================"
              echo "PG_PARTMAN MAINTENANCE"
              echo "================================================================"
              echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "================================================================"

              # Check database connectivity
              if ! psql -c "SELECT version();" > /dev/null 2>&1; then
                echo "ERROR: Failed to connect to database"
                exit 1
              fi
              echo "✓ Database connection successful"
              echo ""

              # Run maintenance with commits between partition sets
              echo "Running pg_partman maintenance..."
              psql -v ON_ERROR_STOP=1 -c "
                -- Run maintenance for all partition sets
                -- p_wait: 1 second between partition sets to reduce load
                -- p_analyze: false (too slow for all tables, run manually when needed)
                SELECT partman.run_maintenance_proc(
                  p_wait := {{ .Values.postgresql.partman.maintenance.waitBetweenSets | default 1 }},
                  p_analyze := {{ .Values.postgresql.partman.maintenance.analyze | default false }}
                );
              "

              echo ""
              echo "✓ Maintenance completed successfully"
              echo ""

              # Get partition statistics
              echo "================================================================"
              echo "PARTITION STATISTICS"
              echo "================================================================"
              psql -c "
                SELECT
                  parent_table,
                  partition_interval,
                  premake,
                  retention,
                  (SELECT COUNT(*) FROM pg_inherits WHERE inhparent = pc.parent_table::regclass) as partition_count,
                  maintenance_last_run
                FROM partman.part_config pc
                ORDER BY parent_table;
              "

              # Check default partitions for unexpected data
              echo ""
              echo "================================================================"
              echo "DEFAULT PARTITION CHECK"
              echo "================================================================"
              psql -c "
                SELECT
                  parent_table,
                  partman.check_default(parent_table) as default_partition_rows
                FROM partman.part_config
                ORDER BY parent_table;
              "

              echo ""
              echo "================================================================"
              echo "MAINTENANCE COMPLETED"
              echo "================================================================"
              echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "================================================================"

            resources:
              {{- toYaml .Values.postgresql.partman.maintenance.resources | nindent 14 }}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 999  # postgres user
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
          securityContext:
            fsGroup: 999
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
{{- end }}
