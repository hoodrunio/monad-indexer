# Production Environment Configuration
# Full HA, high resources, all features enabled

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-production-backend-secret"

  replicaCount: 1

  resources:
    requests:
      cpu: "500m"  # Optimized based on actual usage (~311m/pod)
      memory: "1Gi"  # Optimized based on actual usage (~358Mi/pod)
    limits:
      cpu: "1000m"  # Added CPU limit for burst protection
      memory: "4Gi"  # Reduced from 8Gi for efficiency

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2  # Reduced from 5 for efficient resource usage
    targetCPUUtilizationPercentage: 80  # Increased from 60 to prevent aggressive scaling
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 120  # Increased from 60 for stability
        policies:
        - type: Percent
          value: 100
          periodSeconds: 120  # Increased from 60 for stability
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 120  # Increased from 60 for stability

  podDisruptionBudget:
    enabled: true
    minAvailable: 1  # Adjusted for single-node cluster

  env:
    INDEXER_MEMORY_LIMIT: "5"
    LOG_LEVEL: "warn"

  config:
    # RPC endpoints with fallback
    rpc:
      httpUrl: "https://monad-rpc.hoodscan.io"
      fallbackHttpUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"
      traceUrl: "https://monad-rpc.hoodscan.io"
      fallbackTraceUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"
      wsUrl: "wss://monad-rpc.hoodscan.io"
      ethCallUrl: "https://monad-rpc.hoodscan.io"
      fallbackEthCallUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"

    api:
      corsAllowedOrigin: "https://monad.hoodscan.io"

  # Topology spread for multi-zone (adjusted for single-node)
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway  # Changed from DoNotSchedule for single-node
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

# Microservices - full HA
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "https://monad.hoodscan.io"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

  sig-provider:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  visualizer:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  stats:
    enabled: true
    replicaCount: 1
    config:
      database:
        runMigrations: true  # Enable migrations on startup
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

# PostgreSQL - production HA
postgresql:
  replicaCount: 1

  # Custom image with pg_partman extension
  image:
    registry: ghcr.io
    repository: hoodrunio/postgresql-partman
    tag: "17"


  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-postgresql-app"

  config:
    sharedBuffers: "2GB"
    effectiveCacheSize: "4GB"
    maintenanceWorkMem: "4GB"
    workMem: "128MB"
    maxConnections: "500"

  primary:
    persistence:
      size: 100Gi
      storageClass: "fast-ssd"  # Use high-performance storage
    resources:
      requests:
        cpu: "1000m"  # Reduced for single-node cluster
        memory: "4Gi"  # Reduced for single-node cluster
      limits:
        memory: "16Gi"

  backup:
    enabled: true
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://monad-indexer-backups/postgresql"

  # Partition management with pg_partman
  partman:
    enabled: true
    retentionDays: 30  # Keep 1 month of data
    premakeDays: 7  # Pre-create partitions for next 7 days
    maintenance:
      enabled: true
      schedule: "0 2 * * *"  # Daily at 2 AM UTC

  pooler:
    enabled: true
    replicaCount: 1
    maxClientConn: 5000
    defaultPoolSize: 100
    # Override default affinity with empty affinity for single-node
    affinity:
      podAntiAffinity: {}

  # Disable pod anti-affinity for single-node cluster
  affinity:
    enablePodAntiAffinity: false  # Must be false for single-node clusters

# Redis - production HA
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  # Override sentinel and metrics images to use latest tags
  sentinel:
    enabled: true
    quorum: 2
    image:
      tag: "latest"
  metrics:
    enabled: true
    image:
      tag: "latest"
  master:
    persistence:
      size: 100Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "1Gi"  # Reduced for single-node cluster
      limits:
        memory: "4Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}
  replica:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}

# Monitoring - full stack
monitoring:
  enabled: false
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 15s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Network policies - strict
networkPolicies:
  enabled: true
  defaultDeny: true
  enableCiliumPolicies: false  # Disabled due to validation errors

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: monad-tn1-indexer.hoodscan.io
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: monad-indexer-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 2s
  # Production rate limiting
  rateLimit:
    enabled: true
    requestsPerSecond: 1000
    burst: 2000

# Stats PostgreSQL (if enabled)
statsPostgresql:
  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-stats-postgresql-app"

# External Secrets configuration for production environment
externalSecrets:
  enabled: true
  aws:
    secretName: "blockscout"  # Shared secret for all environments
