# Production Environment Configuration
# Full HA, high resources, all features enabled

# Environment identifier for S3 credentials
environment: "testnet"

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-production-backend-secret"

  replicaCount: 3  # Conservative start - scale gradually after migration stabilizes

  resources:
    requests:
      cpu: "1000m"  # Keep current to avoid scheduling issues during migration
      memory: "2Gi"  # Keep current for safety
    limits:
      cpu: "2000m"  # Increased from 1500m for better burst capacity
      memory: "6Gi"  # Keep current

  autoscaling:
    enabled: true
    minReplicas: 3  # Conservative minimum - can increase post-migration
    maxReplicas: 6  # Reasonable max for 2-node cluster
    targetCPUUtilizationPercentage: 70  # Lower threshold for faster scaling
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 120  # Increased from 60 for stability
        policies:
        - type: Percent
          value: 100
          periodSeconds: 120  # Increased from 60 for stability
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 120  # Increased from 60 for stability

  podDisruptionBudget:
    enabled: true
    minAvailable: 3  # Increased from 1 to ensure minimum pods per node

  # Pod affinity to distribute across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend

  env:
    INDEXER_MEMORY_LIMIT: "7"  # Increased from 5 for higher memory limit
    LOG_LEVEL: "warn"
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "false"  # Re-enabled for complete indexing
    INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "false"  # Re-enabled for complete indexing
    # Read replica configuration (will connect to PostgreSQL replica for read queries)
    DATABASE_REPLICA_URL: ""  # Will be set to pooler-ro service after HA setup

  config:
    # Database configuration - Use pooler for connection management
    database:
      poolSize: 100  # Increased from 60 for high TPS load
      poolSizeApi: 50  # Increased from 30 for faster API responses

    # RPC endpoints with fallback
    rpc:
      httpUrl: "https://monad-rpc.hoodscan.io"
      fallbackHttpUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"
      traceUrl: "https://monad-rpc.hoodscan.io"
      fallbackTraceUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"
      wsUrl: "wss://monad-rpc.hoodscan.io/ws/"
      ethCallUrl: "https://monad-rpc.hoodscan.io"
      fallbackEthCallUrl: "https://lb.drpc.live/monad-testnet/Ag9VzqLbl0KSsk-eqggyUSEMjYZNtZoR8L4M_hXb38UN"

    api:
      corsAllowedOrigin: "https://monad.hoodscan.io"

  # Topology spread for multi-zone (adjusted for single-node)
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway  # Changed from DoNotSchedule for single-node
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

# Microservices - full HA
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "https://monad.hoodscan.io"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

  sig-provider:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  visualizer:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  stats:
    enabled: true
    replicaCount: 1
    config:
      database:
        runMigrations: true  # Enable migrations on startup
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

# PostgreSQL - production HA (1 primary + 1 replica)
postgresql:
  replicaCount: 2  # Changed from 1 to 2 for HA (1 primary + 1 replica)

  # Custom image with pg_partman extension
  image:
    registry: ghcr.io
    repository: hoodrunio/postgresql-partman
    tag: "17"

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-postgresql-app"

  # Ephemeral volumes size limit - shared memory configuration
  # PostgreSQL with shared_buffers=8GB requires ~9GB of shared memory
  ephemeralVolumesSizeLimit:
    shm: "12Gi"  # Set to 12Gi to provide headroom for 8GB shared_buffers

  config:
    # Optimized for high TPS workload
    sharedBuffers: "8GB"  # Increased from 2GB (25% of total RAM for primary)
    effectiveCacheSize: "24GB"  # Increased from 4GB (75% of total RAM)
    maintenanceWorkMem: "2GB"  # Reduced from 8GB (maintenance operations)
    workMem: "256MB"  # Reduced from 512MB for high concurrency
    maxConnections: "1000"  # Increased from 800 for more connections

    # Timeout optimizations for high TPS
    idle_in_transaction_session_timeout: "30s"  # Increased from 10s to prevent premature disconnects
    statement_timeout: "15s"  # Reduced from 30s to fail fast
    lock_timeout: "5s"  # NEW: Fail fast on lock contention

    # Performance tuning for high TPS
    synchronous_commit: "off"  # Trade durability for performance (safe with WAL archiving)
    wal_buffers: "64MB"  # Increased for high write throughput
    checkpoint_timeout: "15min"  # Increased for less frequent checkpoints
    max_wal_size: "8GB"  # Increased for high write load
    random_page_cost: "1.1"  # Optimized for SSD storage
    effective_io_concurrency: "200"  # Optimized for NVMe storage

    # Lock management
    max_locks_per_transaction: "256"  # Increased for complex transactions
    deadlock_timeout: "1s"  # Fast deadlock detection

  primary:
    persistence:
      size: 300Gi  # Increased from 100Gi for long-term data retention
      storageClass: "fast-ssd"  # Use high-performance NVMe storage
    resources:
      requests:
        cpu: "3000m"  # Balanced for 12-core node with other workloads
        memory: "24Gi"  # Optimized for shared_buffers=8GB with room for OS cache
      limits:
        cpu: "8000m"  # Can burst up to 8 cores when needed
        memory: "40Gi"  # Limit under node capacity for safety

    # Node affinity to schedule on primary node
    nodeSelector:
      postgres-role: primary

  backup:
    enabled: true
    retentionPolicy: "7d"
    secretName: "postgres-backup-creds"
    barmanObjectStore:
      destinationPath: "s3://monad-testnet-archive/postgresql"
      endpointURL: "https://nbg1.your-objectstorage.com"
      s3Credentials:
        accessKeyId:
          name: "postgres-backup-creds"
          key: "ACCESS_KEY_ID"
        secretAccessKey:
          name: "postgres-backup-creds"
          key: "SECRET_ACCESS_KEY"
      wal:
        compression: gzip
        maxParallel: 2

  # Replica configuration
  readReplicas:
    enabled: true
    replicaCount: 1
    persistence:
      size: 300Gi  # Matched with primary
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "2000m"  # Suitable for 6-8 core node
        memory: "16Gi"  # Optimized for read-only workload
      limits:
        cpu: "6000m"  # Can use most of 6-8 core node when needed
        memory: "32Gi"  # Half of node capacity

    # Node affinity to schedule on replica node
    nodeSelector:
      postgres-role: replica

  # Partition management with pg_partman
  partman:
    enabled: true
    retentionDays: 30  # Keep 1 month of data
    premakeDays: 7  # Pre-create partitions for next 7 days
    maintenance:
      enabled: true
      schedule: "0 2 * * *"  # Daily at 2 AM UTC

  pooler:
    enabled: true
    useForBackend: true  # Route backend connections through pooler (best practice)
    replicaCount: 3  # Increased from 1 for high availability
    poolMode: "transaction"  # Release connection after each transaction
    maxClientConn: 10000  # Increased from 5000 for more client connections
    defaultPoolSize: 500  # Increased from 300 for 6 backend replicas (6 × 150 = 900 connections)
    maxDbConnections: 600  # Increased from 350 to match defaultPoolSize
    reservePoolSize: 150  # Increased from 75 for burst capacity

    # Node selector to place pooler pods on node1 (now safe with fixed anti-affinity)
    nodeSelector:
      postgres-role: primary  # Schedule pooler on node1 with postgresql-1

  # Enable pod anti-affinity for multi-node cluster
  affinity:
    enablePodAntiAffinity: true  # Changed from false for multi-node HA
    # Additional anti-affinity to ensure only instance pods (not pooler) are separated
    additionalPodAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values:
                  - monad-indexer-production-postgresql
              - key: cnpg.io/podRole
                operator: In
                values:
                  - instance  # Only apply anti-affinity to instance pods, not pooler
          topologyKey: kubernetes.io/hostname

# Redis - production HA
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  # Override sentinel and metrics images to use latest tags
  sentinel:
    enabled: true
    quorum: 2
    image:
      tag: "latest"
  metrics:
    enabled: true
    image:
      tag: "latest"
  master:
    persistence:
      size: 100Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "1Gi"  # Reduced for single-node cluster
      limits:
        memory: "4Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}
  replica:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}

# Monitoring - full stack
monitoring:
  enabled: false
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 15s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Network policies - strict
networkPolicies:
  enabled: true
  defaultDeny: true
  enableCiliumPolicies: false  # Disabled due to validation errors

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: monad-tn1-indexer.hoodscan.io
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: monad-indexer-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 2s
  # Production rate limiting
  rateLimit:
    enabled: true
    requestsPerSecond: 1000
    burst: 2000

# Stats PostgreSQL (if enabled)
statsPostgresql:
  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-stats-postgresql-app"

# External Secrets configuration for production environment
externalSecrets:
  enabled: true
  aws:
    secretName: "blockscout"  # Shared secret for all environments
