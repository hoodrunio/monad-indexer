---
# Gateway - Development environment gateway for monad-indexer
# Listens on public IP (65.21.183.30) for HTTP and HTTPS traffic
# Domain: monad-tn1-indexer.hoodscan.io

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monad-indexer-gateway
  namespace: monad-indexer-dev
  labels:
    gateway: monad-indexer
    environment: dev
  annotations:
    # Cilium LoadBalancer pool selector - uses public IP pool
    io.cilium/lb-ipam-ips: "65.21.183.30"
spec:
  gatewayClassName: cilium

  listeners:
    # HTTP listener - redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.hoodscan.io"  # Wildcard for all subdomains
      allowedRoutes:
        namespaces:
          from: Same

    # HTTPS listener - terminates TLS (Monad Indexer)
    - name: https-monad
      protocol: HTTPS
      port: 443
      hostname: "monad-tn1-indexer.hoodscan.io"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: monad-tn1-indexer-tls  # cert-manager will create this

    # HTTPS listener - terminates TLS (ArgoCD)
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: "cd.hoodscan.io"
      allowedRoutes:
        namespaces:
          from: All  # Allow routes from argocd namespace
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-gateway-tls
            namespace: monad-indexer-dev

  # Address configuration - request public IP from LoadBalancer pool
  addresses:
    - type: IPAddress
      value: "65.21.183.30"
