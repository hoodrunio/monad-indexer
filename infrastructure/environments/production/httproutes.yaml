# HTTPRoutes for Production Environment
# These route traffic from Gateway listeners to backend services

---
# HTTPRoute for ArgoCD Web UI
# Note: Gateway API doesn't support mixed HTTP/gRPC on same hostname (GEP-1016)
# This route only handles Web UI traffic. For CLI access, use NodePort (port 30080)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-production
      sectionName: https-argocd
  hostnames:
    - cd.hoodscan.io
  rules:
    - backendRefs:
        - name: argocd-server-http
          port: 80

---
# HTTPRoute for Monad Indexer Backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monad-indexer-backend
  namespace: monad-indexer-production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-production
      sectionName: https-monad-indexer
  hostnames:
    - monad-tn1-indexer.hoodscan.io
  rules:
    - backendRefs:
        - name: backend
          port: 4000
