version: '3.9'

services:
  stats-db-init:
    image: postgres:14
    container_name: stats-postgres-init
    command: bash -c "psql -U $${POSTGRES_USER} -d postgres -c 'CREATE DATABASE IF NOT EXISTS stats;'"
    environment:
      POSTGRES_HOST: 'stats-db'
      POSTGRES_DB: 'postgres'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - stats-db-data:/var/lib/postgresql/data

  stats-db:
    image: postgres:14
    container_name: stats-db
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_HOST: 'stats-db'
      POSTGRES_DB: 'stats'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    ports:
      - 7433:5432

  stats:
    image: ghcr.io/blockscout/stats:latest
    pull_policy: always
    container_name: stats
    restart: always
    env_file:
      - ./envs/common-stats.env
    environment:
      STATS__DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@stats-db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/blockscout
      STATS__CREATE_DATABASE: 'true'
      STATS__RUN_MIGRATIONS: 'true'
    ports:
      - 8080:8080

volumes:
  stats-db-data:
