{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "monad-indexer.fullname" . }}-alerts
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
spec:
  groups:
    - name: backend-indexer
      interval: 30s
      rules:
        # Indexing lag alert
        - alert: BlockchainIndexingLag
          expr: |
            (latest_block_number - indexed_block_number) > 100
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Blockchain indexer is lagging"
            description: {{ `"Indexer is {{ $value }} blocks behind chain head"` | quote }}

        # Backend pods down
        - alert: BackendPodsDown
          expr: |
            kube_deployment_status_replicas_available{deployment="{{ include "monad-indexer.fullname" . }}-backend"} < 1
          for: 5m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Backend pods are down"
            description: {{ `"Only {{ $value }} backend pods available"` | quote }}

        # High CPU usage
        - alert: BackendHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"}[5m]) > 0.8
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Backend high CPU usage"
            description: {{ `"Backend CPU usage is {{ $value | humanizePercentage }}"` | quote }}

        # High memory usage
        - alert: BackendHighMemory
          expr: |
            container_memory_usage_bytes{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"} /
            container_spec_memory_limit_bytes{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"} > 0.85
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Backend high memory usage"
            description: {{ `"Backend memory usage is {{ $value | humanizePercentage }}"` | quote }}

    - name: postgresql
      interval: 30s
      rules:
        # PostgreSQL down
        - alert: PostgreSQLDown
          expr: |
            up{job="{{ include "monad-indexer.fullname" . }}-postgresql"} == 0
          for: 1m
          labels:
            severity: critical
            component: postgresql
          annotations:
            summary: "PostgreSQL instance down"
            description: {{ `"PostgreSQL instance {{ $labels.instance }} is down"` | quote }}

        # Replication lag
        - alert: PostgreSQLReplicationLag
          expr: |
            pg_replication_lag_seconds > 300
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL replication lag high"
            description: {{ `"Replication lag is {{ $value }} seconds"` | quote }}

    - name: redis
      interval: 30s
      rules:
        # Redis down
        - alert: RedisDown
          expr: |
            redis_up == 0
          for: 1m
          labels:
            severity: critical
            component: redis
          annotations:
            summary: "Redis instance down"
            description: {{ `"Redis instance {{ $labels.instance }} is down"` | quote }}
{{- end }}
