{{- if and .Values.postgresql.enabled .Values.postgresql.readOnlyPooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "monad-indexer.fullname" . }}-pooler-ro
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer-ro
spec:
  cluster:
    name: {{ include "monad-indexer.fullname" . }}-postgresql

  instances: {{ .Values.postgresql.readOnlyPooler.replicaCount | default 2 }}
  type: ro  # Read-only pooler - connects to replicas

  # PgBouncer configuration optimized for read-heavy API workloads
  pgbouncer:
    poolMode: {{ .Values.postgresql.readOnlyPooler.poolMode | default "transaction" }}
    parameters:
      # Connection limits - optimized for fast read queries
      max_client_conn: {{ .Values.postgresql.readOnlyPooler.maxClientConn | default "5000" | quote }}
      default_pool_size: {{ .Values.postgresql.readOnlyPooler.defaultPoolSize | default "20" | quote }}
      reserve_pool_size: {{ .Values.postgresql.readOnlyPooler.reservePoolSize | default "5" | quote }}
      reserve_pool_timeout: {{ .Values.postgresql.readOnlyPooler.reservePoolTimeout | default "5" | quote }}
      max_db_connections: {{ .Values.postgresql.readOnlyPooler.maxDbConnections | default "40" | quote }}
      max_user_connections: {{ .Values.postgresql.readOnlyPooler.maxUserConnections | default "40" | quote }}

      # Timeouts - aggressive for fast read queries
      server_idle_timeout: {{ .Values.postgresql.readOnlyPooler.serverIdleTimeout | default "300" | quote }}
      server_lifetime: {{ .Values.postgresql.readOnlyPooler.serverLifetime | default "1800" | quote }}
      server_connect_timeout: {{ .Values.postgresql.readOnlyPooler.serverConnectTimeout | default "10" | quote }}
      query_timeout: {{ .Values.postgresql.readOnlyPooler.queryTimeout | default "60" | quote }}
      query_wait_timeout: {{ .Values.postgresql.readOnlyPooler.queryWaitTimeout | default "30" | quote }}

      # Logging
      log_connections: {{ .Values.postgresql.readOnlyPooler.logConnections | default "1" | quote }}
      log_disconnections: {{ .Values.postgresql.readOnlyPooler.logDisconnections | default "1" | quote }}

      {{- if .Values.postgresql.readOnlyPooler.additionalParameters }}
      {{- range $key, $value := .Values.postgresql.readOnlyPooler.additionalParameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- end }}

  # Monitoring
  {{- if .Values.postgresql.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  # Template for pooler pods
  template:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer-ro
    spec:
      containers:
      - name: pgbouncer
        {{- if .Values.postgresql.readOnlyPooler.resources }}
        resources:
          {{- toYaml .Values.postgresql.readOnlyPooler.resources | nindent 10 }}
        {{- else }}
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            memory: "512Mi"
        {{- end }}

        {{- if .Values.postgresql.readOnlyPooler.securityContext }}
        securityContext:
          {{- toYaml .Values.postgresql.readOnlyPooler.securityContext | nindent 10 }}
        {{- end }}

      {{- if .Values.postgresql.readOnlyPooler.affinity }}
      affinity:
        {{- toYaml .Values.postgresql.readOnlyPooler.affinity | nindent 8 }}
      {{- else }}
      # Default soft anti-affinity: prefer different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: cnpg.io/poolerName
                  operator: In
                  values:
                  - {{ include "monad-indexer.fullname" . }}-pooler-ro
              topologyKey: kubernetes.io/hostname
      {{- end }}

      {{- if .Values.postgresql.readOnlyPooler.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.postgresql.readOnlyPooler.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.postgresql.readOnlyPooler.tolerations }}
      tolerations:
        {{- toYaml .Values.postgresql.readOnlyPooler.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
