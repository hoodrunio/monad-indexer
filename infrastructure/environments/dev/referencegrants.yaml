# ReferenceGrants for cross-namespace Gateway access

---
# Allow ArgoCD HTTPRoute to reference backend Service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-httproute-to-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: ""
      kind: Service
      name: argocd-server

---
# Allow Gateway to reference ArgoCD TLS Secret
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-argocd-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: monad-indexer-dev
  to:
    - group: ""
      kind: Secret
      name: argocd-tls

---
# Allow ArgoCD HTTPRoute to reference Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-httproute-to-gateway
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: monad-indexer-gateway

---
# Allow ArgoCD HTTPRoute to reference HTTP-only Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-httproute-to-http-gateway
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: monad-indexer-http-gateway
