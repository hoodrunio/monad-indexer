{{- if and .Values.postgresql.enabled .Values.postgresql.citusWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monad-indexer.fullname" . }}-citus-worker-config
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: citus-worker
data:
  01-init-citus.sh: |
    #!/bin/bash
    set -e

    # Wait for PostgreSQL to be ready
    until pg_isready -U postgres; do
      echo "Waiting for PostgreSQL to start..."
      sleep 2
    done

    echo "Creating Citus extension..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE EXTENSION IF NOT EXISTS citus;
    EOSQL

    echo "Citus worker initialization complete!"

  02-configure-postgres.sh: |
    #!/bin/bash
    set -e

    # PostgreSQL configuration for Citus worker
    cat >> ${PGDATA}/postgresql.conf <<-EOF
    # Citus worker configuration
    shared_preload_libraries = 'citus'
    citus.node_conninfo = 'sslmode=prefer'

    # Memory configuration
    shared_buffers = {{ .Values.postgresql.citusWorker.config.sharedBuffers | default "6GB" }}
    effective_cache_size = {{ .Values.postgresql.citusWorker.config.effectiveCacheSize | default "18GB" }}
    maintenance_work_mem = {{ .Values.postgresql.citusWorker.config.maintenanceWorkMem | default "2GB" }}
    work_mem = {{ .Values.postgresql.citusWorker.config.workMem | default "512MB" }}

    # Connection settings
    max_connections = {{ .Values.postgresql.citusWorker.config.maxConnections | default "300" }}

    # WAL configuration
    wal_buffers = '64MB'
    max_wal_size = '4GB'
    min_wal_size = '512MB'
    checkpoint_timeout = '15min'
    checkpoint_completion_target = 0.9

    # Performance tuning
    random_page_cost = 1.1
    effective_io_concurrency = 200
    synchronous_commit = off

    # Logging
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_connections = on
    log_disconnections = on
    log_checkpoints = on
    log_lock_waits = on

    # Parallel query
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8

    # Autovacuum
    autovacuum = on
    autovacuum_max_workers = 4
    autovacuum_naptime = 10s
    EOF

    # pg_hba configuration to allow coordinator connections
    cat >> ${PGDATA}/pg_hba.conf <<-EOF
    # Trust Kubernetes internal network for Citus node-to-node communication
    # This is safe as we're inside Kubernetes cluster network
    host    all    postgres    10.0.0.0/8    trust
    host    all    postgres    172.16.0.0/12 trust
    host    all    postgres    192.168.0.0/16 trust
    EOF

    echo "Worker PostgreSQL configuration complete!"
{{- end }}
