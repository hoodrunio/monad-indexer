{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "monad-indexer.fullname" . }}-alerts
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
spec:
  groups:
    - name: backend-indexer
      interval: 30s
      rules:
        # Indexing lag alert
        - alert: BlockchainIndexingLag
          expr: |
            (latest_block_number - indexed_block_number) > 100
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Blockchain indexer is lagging"
            description: "Indexer is {{ $value }} blocks behind chain head"

        # Backend pods down
        - alert: BackendPodsDown
          expr: |
            kube_deployment_status_replicas_available{deployment="{{ include "monad-indexer.fullname" . }}-backend"} < 1
          for: 5m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Backend pods are down"
            description: "Only {{ $value }} backend pods available"

        # High CPU usage
        - alert: BackendHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"}[5m]) > 0.8
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Backend high CPU usage"
            description: "Backend CPU usage is {{ $value | humanizePercentage }}"

        # High memory usage
        - alert: BackendHighMemory
          expr: |
            container_memory_usage_bytes{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"} /
            container_spec_memory_limit_bytes{pod=~"{{ include "monad-indexer.fullname" . }}-backend-.*"} > 0.85
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Backend high memory usage"
            description: "Backend memory usage is {{ $value | humanizePercentage }}"

    - name: postgresql
      interval: 30s
      rules:
        # PostgreSQL down
        - alert: PostgreSQLDown
          expr: |
            up{job="{{ include "monad-indexer.fullname" . }}-postgresql"} == 0
          for: 1m
          labels:
            severity: critical
            component: postgresql
          annotations:
            summary: "PostgreSQL instance down"
            description: "PostgreSQL instance {{ $labels.instance }} is down"

        # Replication lag
        - alert: PostgreSQLReplicationLag
          expr: |
            pg_replication_lag_seconds > 300
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL replication lag high"
            description: "Replication lag is {{ $value }} seconds"

        # Low cache hit ratio
        - alert: PostgreSQLLowCacheHitRatio
          expr: |
            rate(pg_stat_database_blks_hit[5m]) /
            (rate(pg_stat_database_blks_hit[5m]) + rate(pg_stat_database_blks_read[5m])) < 0.95
          for: 15m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL cache hit ratio low"
            description: "Cache hit ratio is {{ $value | humanizePercentage }} (should be >95%)"

        # High connections
        - alert: PostgreSQLHighConnections
          expr: |
            pg_stat_activity_count / pg_settings_max_connections > 0.8
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL connection limit approaching"
            description: "Using {{ $value | humanizePercentage }} of max connections"

        # Disk space warning
        - alert: PostgreSQLDiskSpaceWarning
          expr: |
            (pg_database_size_bytes / node_filesystem_size_bytes) > 0.8
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL disk space warning"
            description: "Database is using {{ $value | humanizePercentage }} of disk space"

    - name: redis
      interval: 30s
      rules:
        # Redis down
        - alert: RedisDown
          expr: |
            redis_up == 0
          for: 1m
          labels:
            severity: critical
            component: redis
          annotations:
            summary: "Redis instance down"
            description: "Redis instance {{ $labels.instance }} is down"

        # High memory usage
        - alert: RedisHighMemoryUsage
          expr: |
            redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "Redis high memory usage"
            description: "Redis memory usage is {{ $value | humanizePercentage }}"

        # Rejected connections
        - alert: RedisRejectedConnections
          expr: |
            rate(redis_rejected_connections_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "Redis rejecting connections"
            description: "Redis is rejecting {{ $value }} connections per second"
{{- end }}
