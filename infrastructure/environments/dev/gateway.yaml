# Gateway for Development Environment
# Public IP: 65.21.183.30
# Domains: cd.hoodscan.io, monad-tn1-indexer.hoodscan.io

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monad-indexer-gateway
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    gateway: monad-indexer
    environment: dev
spec:
  gatewayClassName: cilium

  addresses:
    - type: IPAddress
      value: "65.21.183.30"

  listeners:
    # HTTP listener for all domains (cert-manager HTTP-01 challenges)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All  # Required for cert-manager to create HTTPRoutes

    # HTTPS listener for ArgoCD (cd.hoodscan.io)
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: cd.hoodscan.io
      allowedRoutes:
        namespaces:
          from: All  # ArgoCD is in different namespace
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
            namespace: argocd

    # HTTPS listener for Monad Indexer (monad-tn1-indexer.hoodscan.io)
    - name: https-monad-indexer
      protocol: HTTPS
      port: 443
      hostname: monad-tn1-indexer.hoodscan.io
      allowedRoutes:
        namespaces:
          from: Same  # App is in same namespace
      tls:
        mode: Terminate
        certificateRefs:
          - name: monad-indexer-tls
