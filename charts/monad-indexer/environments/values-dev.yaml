# Development Environment Configuration
# Minimal resources, single replicas, relaxed settings

backend:
  replicaCount: 1

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  env:
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
    LOG_LEVEL: "debug"

# Disable microservices in dev (optional)
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
  sig-provider:
    enabled: false
  visualizer:
    enabled: false
  stats:
    enabled: false

# PostgreSQL - minimal for dev
postgresql:
  replicaCount: 1

  auth:
    password: "devpassword123"  # Dev-only password

  config:
    sharedBuffers: "512MB"
    effectiveCacheSize: "1536MB"
    maintenanceWorkMem: "128MB"
    maxConnections: "100"

  primary:
    persistence:
      size: 100Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

  backup:
    enabled: false

  pooler:
    enabled: true
    replicaCount: 1
    affinity: {}  # Disable anti-affinity for single-node dev

  monitoring:
    enabled: false
    enablePodMonitor: false

# Redis - minimal (single master, no replicas for dev)
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  replica:
    replicaCount: 1  # Schema requires minimum 1
  sentinel:
    enabled: false
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

# Monitoring - disabled in dev
monitoring:
  enabled: false

# Network policies - disabled for easier debugging
networkPolicies:
  enabled: false
  enableCiliumPolicies: false

# Ingress - optional
ingress:
  enabled: true
  hosts:
    - host: indexer-dev.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
