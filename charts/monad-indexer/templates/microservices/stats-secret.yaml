{{- $stats := index .Values.microservices "stats" }}
{{- if and $stats.enabled (not $stats.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monad-indexer.fullname" . }}-stats-secret
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: stats
  {{- if $stats.secret.annotations }}
  annotations:
    {{- toYaml $stats.secret.annotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Stats service database connection URL
  # Format: postgresql://user:password@host:port/database
  stats-db-url: {{ printf "postgresql://%s:%s@%s-stats-postgresql-rw:5432/%s"
    .Values.statsPostgresql.auth.username
    .Values.statsPostgresql.auth.password
    (include "monad-indexer.fullname" .)
    .Values.statsPostgresql.auth.database | quote }}

  # Blockscout main database connection URL (read-only access)
  # Stats service needs to read from main database for statistics calculation
  blockscout-db-url: {{ include "monad-indexer.postgresql.connectionString" . | quote }}
{{- end }}
