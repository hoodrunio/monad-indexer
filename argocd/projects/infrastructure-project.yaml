# ArgoCD Project for Infrastructure Components
# Includes: Cilium, Prometheus, CloudNativePG Operator, External Secrets Operator

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: Infrastructure and platform services

  # Source repositories
  sourceRepos:
    - 'https://github.com/hoodrunio/monad-indexer.git'  # Replace with your repo
    - 'https://helm.cilium.io/'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://cloudnative-pg.github.io/charts'
    - 'https://charts.external-secrets.io'

  # Allowed destinations
  destinations:
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc
    - namespace: 'cilium-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'cnpg-system'
      server: https://kubernetes.default.svc
    - namespace: 'external-secrets'
      server: https://kubernetes.default.svc
    - namespace: 'argocd'
      server: https://kubernetes.default.svc

  # Cluster resource whitelist - infrastructure needs cluster-level resources
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'storage.k8s.io'
      kind: StorageClass
    - group: 'cilium.io'
      kind: CiliumLoadBalancerIPPool
    - group: 'cilium.io'
      kind: CiliumL2AnnouncementPolicy
    - group: 'monitoring.coreos.com'
      kind: ServiceMonitor
    - group: 'monitoring.coreos.com'
      kind: PodMonitor
    - group: 'monitoring.coreos.com'
      kind: PrometheusRule

  # Namespace resource whitelist (allow all in allowed namespaces)
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Role bindings
  roles:
    - name: admin
      description: Full infrastructure access
      policies:
        - p, proj:infrastructure:admin, applications, *, infrastructure/*, allow
      groups:
        - platform-team
        - sre-team
