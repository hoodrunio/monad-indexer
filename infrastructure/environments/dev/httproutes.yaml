# HTTPRoutes for Development Environment
# These route traffic from Gateway listeners to backend services

---
# HTTPRoute for ArgoCD
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-argocd
  hostnames:
    - cd.hoodscan.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443

---
# HTTPRoute for Monad Indexer Backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monad-indexer-backend
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-monad-indexer
  hostnames:
    - monad-tn1-indexer.hoodscan.io
  rules:
    - backendRefs:
        - name: backend
          port: 4000
