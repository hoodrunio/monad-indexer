{{- if .Values.precompile.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monad-indexer.fullname" . }}-seed-precompile-abis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: precompile-seeder
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.precompile.job.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.precompile.job.timeoutSeconds | default 300 }}
  template:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: precompile-seeder
    spec:
      serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- with .Values.precompile.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.precompile.job.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: seed-precompile-abis
        image: {{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: {{ include "monad-indexer.fullname" . }}-postgresql-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: password
        - name: PRECOMPILE_ADDRESS
          value: {{ .Values.precompile.address | quote }}
        - name: PRECOMPILE_NAME
          value: {{ .Values.precompile.name | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "================================================================"
          echo "MONAD PRECOMPILE ABI SEEDER"
          echo "================================================================"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Precompile Address: ${PRECOMPILE_ADDRESS}"
          echo "Precompile Name: ${PRECOMPILE_NAME}"
          echo "Database: ${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "================================================================"

          # Wait for database to be ready
          echo ">>> Waiting for database to be ready..."
          max_attempts=30
          attempt=0
          until psql -c "SELECT 1" > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Waiting for database... attempt $attempt/$max_attempts"
            sleep 2
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Database not available after $max_attempts attempts"
            exit 1
          fi

          echo ">>> Database is ready!"

          # Verify smart_contracts table exists
          echo ">>> Verifying smart_contracts table exists..."
          if ! psql -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'smart_contracts');" | grep -q 't'; then
            echo "ERROR: smart_contracts table does not exist!"
            echo "Please ensure the database schema has been initialized by Blockscout."
            exit 1
          fi

          echo ">>> Table exists, proceeding with ABI seeding..."

          # Load ABI JSON from ConfigMap
          echo ">>> Loading ABI from ConfigMap..."
          ABI_CONTENT=$(cat /mnt/abi/staking_abi.json)
          echo ">>> ABI loaded successfully"

          # Execute SQL to insert precompile ABI
          echo ">>> Inserting precompile ABI into database..."
          psql -v ON_ERROR_STOP=1 <<EOF
          DO \$\$
          DECLARE
            precompile_address BYTEA := decode('${PRECOMPILE_ADDRESS#0x}', 'hex');
            abi_json JSONB := '${ABI_CONTENT}'::jsonb;
          BEGIN
            -- Insert or update the precompile contract
            INSERT INTO smart_contracts (
              address_hash,
              name,
              abi,
              compiler_version,
              optimization,
              contract_source_code,
              is_vyper_contract,
              partially_verified,
              verified_via_sourcify,
              verified_via_eth_bytecode_db,
              verified_via_verifier_alliance,
              inserted_at,
              updated_at
            ) VALUES (
              precompile_address,
              '${PRECOMPILE_NAME}',
              abi_json,
              'precompile',
              false,
              '-- Monad native staking precompile\n-- This is a precompiled contract and cannot be verified through traditional means.\n-- Address: ${PRECOMPILE_ADDRESS}\n-- Documentation: https://docs.monad.xyz/',
              false,
              false,
              false,
              false,
              false,
              NOW(),
              NOW()
            )
            ON CONFLICT (address_hash)
            DO UPDATE SET
              name = EXCLUDED.name,
              abi = EXCLUDED.abi,
              compiler_version = EXCLUDED.compiler_version,
              contract_source_code = EXCLUDED.contract_source_code,
              updated_at = NOW();

            RAISE NOTICE 'Successfully seeded precompile ABI for address: ${PRECOMPILE_ADDRESS}';
          END \$\$;

          -- Verify insertion
          SELECT
            '0x' || encode(address_hash, 'hex') as address,
            name,
            compiler_version,
            jsonb_array_length(abi) as abi_entries,
            inserted_at,
            updated_at
          FROM smart_contracts
          WHERE address_hash = decode('${PRECOMPILE_ADDRESS#0x}', 'hex');
          EOF

          if [ $? -eq 0 ]; then
            echo ""
            echo "================================================================"
            echo "SUCCESS: Precompile ABI seeded successfully!"
            echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "================================================================"
            exit 0
          else
            echo ""
            echo "================================================================"
            echo "ERROR: Failed to seed precompile ABI"
            echo "Failed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "================================================================"
            exit 1
          fi

        volumeMounts:
        - name: abi
          mountPath: /mnt/abi
          readOnly: true
        {{- with .Values.precompile.job.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: abi
        configMap:
          name: {{ include "monad-indexer.fullname" . }}-precompile-abi
{{- end }}
