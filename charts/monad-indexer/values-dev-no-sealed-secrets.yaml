# Development Values (without Sealed Secrets)
# Use this for local development when you don't want to use sealed secrets
# Deploy with: make deploy VALUES_FILE=values-dev-no-sealed-secrets.yaml

backend:
  existingSecret: ""  # Disable sealed secrets
  secret:
    secretKeyBase: "dev-secret-key-not-for-production-use-only"

postgresql:
  auth:
    existingSecret: ""  # Disable sealed secrets
    password: "dev-postgres-password"  # Chart will create a secret

statsPostgresql:
  auth:
    existingSecret: ""  # Disable sealed secrets
    password: "dev-stats-password"  # Chart will create a secret
