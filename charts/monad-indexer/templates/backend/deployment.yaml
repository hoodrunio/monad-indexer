{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend
  labels:
    {{- include "monad-indexer.backend.labels" . | nindent 4 }}
  {{- if .Values.backend.annotations }}
  annotations:
    {{- toYaml .Values.backend.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}

  {{- if .Values.backend.updateStrategy }}
  strategy:
    {{- toYaml .Values.backend.updateStrategy | nindent 4 }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "monad-indexer.backend.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
        {{- if .Values.backend.podAnnotations }}
        {{- toYaml .Values.backend.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "monad-indexer.backend.selectorLabels" . | nindent 8 }}
        {{- if .Values.backend.podLabels }}
        {{- toYaml .Values.backend.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- include "monad-indexer.imagePullSecrets" . | nindent 6 }}

      serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}

      {{- if .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- end }}

      {{- if .Values.backend.initContainers }}
      initContainers:
        {{- if .Values.backend.initContainers.waitForPostgres.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              {{- if .Values.postgresql.pooler.enabled }}
              until nc -z {{ include "monad-indexer.fullname" . }}-pooler 5432; do
              {{- else }}
              until nc -z {{ include "monad-indexer.fullname" . }}-postgresql-rw 5432; do
              {{- end }}
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          {{- if .Values.backend.initContainers.waitForPostgres.resources }}
          resources:
            {{- toYaml .Values.backend.initContainers.waitForPostgres.resources | nindent 12 }}
          {{- end }}
        {{- end }}

        {{- if .Values.backend.initContainers.waitForRedis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "monad-indexer.fullname" . }}-redis-master 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready"
          {{- if .Values.backend.initContainers.waitForRedis.resources }}
          resources:
            {{- toYaml .Values.backend.initContainers.waitForRedis.resources | nindent 12 }}
          {{- end }}
        {{- end }}

        {{- if .Values.backend.initContainers.dbMigration.enabled }}
        - name: db-migration
          image: {{ include "monad-indexer.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              echo "DATABASE_URL: $DATABASE_URL"
              echo "ECTO_USE_SSL: $ECTO_USE_SSL"
              bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()"
          envFrom:
            - configMapRef:
                name: {{ include "monad-indexer.fullname" . }}-backend-config
          env:
            {{- include "monad-indexer.backend.env" . | nindent 12 }}
          {{- if .Values.backend.initContainers.dbMigration.resources }}
          resources:
            {{- toYaml .Values.backend.initContainers.dbMigration.resources | nindent 12 }}
          {{- end }}
        {{- end }}

        {{- if .Values.backend.extraInitContainers }}
        {{- toYaml .Values.backend.extraInitContainers | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        - name: backend
          image: {{ include "monad-indexer.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          {{- if .Values.backend.command }}
          command:
            {{- toYaml .Values.backend.command | nindent 12 }}
          {{- end }}

          {{- if .Values.backend.args }}
          args:
            {{- toYaml .Values.backend.args | nindent 12 }}
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "monad-indexer.fullname" . }}-backend-config
            {{- if .Values.backend.envFrom }}
            {{- toYaml .Values.backend.envFrom | nindent 12 }}
            {{- end }}

          env:
            {{- include "monad-indexer.backend.env" . | nindent 12 }}

          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.backend.livenessProbe.httpGet }}
            httpGet:
              {{- toYaml .Values.backend.livenessProbe.httpGet | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.backend.livenessProbe.successThreshold }}
          {{- end }}

          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.backend.readinessProbe.httpGet }}
            httpGet:
              {{- toYaml .Values.backend.readinessProbe.httpGet | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.backend.readinessProbe.successThreshold }}
          {{- end }}

          {{- if .Values.backend.startupProbe.enabled }}
          startupProbe:
            {{- if .Values.backend.startupProbe.httpGet }}
            httpGet:
              {{- toYaml .Values.backend.startupProbe.httpGet | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.backend.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.backend.startupProbe.successThreshold }}
          {{- end }}

          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}

          {{- if .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          {{- end }}

          {{- if .Values.backend.lifecycle }}
          lifecycle:
            {{- toYaml .Values.backend.lifecycle | nindent 12 }}
          {{- end }}

          volumeMounts:
            {{- if .Values.backend.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.backend.persistence.mountPath }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: dets
              mountPath: /app/dets
            {{- if .Values.backend.extraVolumeMounts }}
            {{- toYaml .Values.backend.extraVolumeMounts | nindent 12 }}
            {{- end }}

      volumes:
        {{- if .Values.backend.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "monad-indexer.fullname" . }}-backend-data
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: dets
          emptyDir: {}
        {{- if .Values.backend.extraVolumes }}
        {{- toYaml .Values.backend.extraVolumes | nindent 8 }}
        {{- end }}

      {{- if .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.backend.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.backend.affinity }}
      affinity:
        {{- toYaml .Values.backend.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.backend.tolerations }}
      tolerations:
        {{- toYaml .Values.backend.tolerations | nindent 8 }}
      {{- end }}

      {{- if .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.backend.topologySpreadConstraints | nindent 8 }}
      {{- end }}
{{- end }}

{{/*
Helper template for backend environment variables from Secrets
All ConfigMap variables are loaded via envFrom - this template only handles Secret values
*/}}
{{- define "monad-indexer.backend.env" -}}
- name: DATABASE_URL
  valueFrom:
    secretKeyRef:
      {{- if .Values.postgresql.auth.existingSecret }}
      # Read DATABASE_URL from existing secret (managed by External Secrets Operator)
      name: {{ .Values.postgresql.auth.existingSecret }}
      key: uri
      {{- else }}
      # Dev/testing: use chart-generated connection string
      name: {{ printf "%s-postgresql-app" (include "monad-indexer.fullname" .) }}
      key: uri
      {{- end }}
- name: SECRET_KEY_BASE
  valueFrom:
    secretKeyRef:
      name: {{ .Values.backend.existingSecret | default (printf "%s-backend-secret" (include "monad-indexer.fullname" .)) }}
      key: secret-key-base
{{- if .Values.backend.extraEnv }}
{{- toYaml .Values.backend.extraEnv }}
{{- end }}
{{- end -}}
