{{- if .Values.precompile.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monad-indexer.fullname" . }}-precompile-seed-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: precompile-seeder
data:
  seed-precompile.sql: |
    -- Seed Monad Staking Precompile ABI into smart_contracts table
    -- This script is idempotent and can be run multiple times safely

    DO $$
    DECLARE
      precompile_address BYTEA := decode('{{ .Values.precompile.address | trimPrefix "0x" }}', 'hex');
      abi_json JSONB;
    BEGIN
      -- Load ABI from file (will be replaced by actual ABI at runtime)
      abi_json := :'abi_content'::jsonb;

      -- Insert or update the precompile contract
      INSERT INTO smart_contracts (
        address_hash,
        name,
        abi,
        compiler_version,
        optimization,
        contract_source_code,
        is_vyper_contract,
        partially_verified,
        verified_via_sourcify,
        verified_via_eth_bytecode_db,
        verified_via_verifier_alliance,
        inserted_at,
        updated_at
      ) VALUES (
        precompile_address,
        '{{ .Values.precompile.name }}',
        abi_json,
        'precompile',
        false,
        '-- Monad native staking precompile\n-- This is a precompiled contract and cannot be verified through traditional means.\n-- Address: {{ .Values.precompile.address }}\n-- Documentation: https://docs.monad.xyz/',
        false,
        false,
        false,
        false,
        false,
        NOW(),
        NOW()
      )
      ON CONFLICT (address_hash)
      DO UPDATE SET
        name = EXCLUDED.name,
        abi = EXCLUDED.abi,
        compiler_version = EXCLUDED.compiler_version,
        contract_source_code = EXCLUDED.contract_source_code,
        updated_at = NOW();

      -- Verify insertion
      IF FOUND THEN
        RAISE NOTICE 'Successfully seeded precompile ABI for address: {{ .Values.precompile.address }}';
      END IF;
    END $$;

    -- Query to verify the precompile was inserted
    SELECT
      encode(address_hash, 'hex') as address,
      name,
      compiler_version,
      jsonb_array_length(abi) as abi_entries,
      inserted_at,
      updated_at
    FROM smart_contracts
    WHERE address_hash = decode('{{ .Values.precompile.address | trimPrefix "0x" }}', 'hex');
{{- end }}
