# ExternalSecret for Cilium API Server Configuration - Production
# Fetches k8sServiceHost and k8sServicePort from AWS Secrets Manager
# Uses the existing 'blockscout' secret with Prod prefix

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cilium-config-aws-secrets
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"  # Must be created before Cilium
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cilium-api-server-config
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"  # Must be created before Cilium
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cilium-config-aws-secrets
    kind: SecretStore
  target:
    name: cilium-api-server-config
    creationPolicy: Owner
    # Create a Secret that Cilium can reference using k8sServiceHostRef
    template:
      engineVersion: v2
      data:
        k8sServiceHost: "{{ .Prodk8sServiceHost }}"
        k8sServicePort: "{{ .Prodk8sServicePort }}"
  dataFrom:
    - extract:
        key: blockscout
