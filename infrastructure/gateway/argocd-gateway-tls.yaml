# TLS Certificate for ArgoCD access via Gateway
# This certificate is referenced by the Gateway listener
# Stored in monad-indexer-dev namespace (same as Gateway)

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-gateway-tls
  namespace: monad-indexer-dev
spec:
  secretName: argocd-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cd.hoodscan.io
