{{- if and .Values.externalSecrets.enabled .Values.statsPostgresql.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "monad-indexer.fullname" . }}-stats-postgresql
  namespace: {{ .Release.Namespace }}
  labels: {{- include "monad-indexer.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "monad-indexer.fullname" . }}-aws-secrets
    kind: SecretStore
  target:
    name: {{ .Values.statsPostgresql.auth.existingSecret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "stats"
        password: {{ `"{{ .STATS_PASSWORD }}"` }}
        uri: {{ `"postgresql://stats:{{ .STATS_PASSWORD }}@{{ include "monad-indexer.fullname" . }}-stats-postgresql-rw:5432/stats?sslmode=disable"` }}
  data:
    - secretKey: STATS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName }}
        property: STATS_PASSWORD
{{- end }}
