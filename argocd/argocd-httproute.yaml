# ArgoCD HTTPRoute - Production Access via Cilium Gateway API
# Access ArgoCD at: https://argocd.hoodscan.io

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
  annotations:
    # Let's Encrypt will automatically create TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      kind: Gateway

  hostnames:
    - "cd.hoodscan.io"  # Update with your domain

  rules:
    # Main ArgoCD UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 443
          kind: Service

---
# TLS Certificate for ArgoCD
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cd.hoodscan.io  # Update with your domain
