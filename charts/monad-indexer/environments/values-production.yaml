# Production Environment Configuration
# Full HA, high resources, all features enabled

# Environment identifier for S3 credentials
environment: "mainnet"

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-production-backend-secret"

  # Custom Blockscout image with Replica1 support
  image:
    registry: ghcr.io
    repository: hoodrunio/blockscout
    tag: "9.2.2"
    pullPolicy: Always

  replicaCount: 1  # Reduced from 3 - fewer, more powerful pods

  resources:
    requests:
      cpu: "4000m"  # Increased from 1000m (3x) for powerful indexing
      memory: "6Gi"  # Increased from 2Gi (3x) for better performance
    limits:
      cpu: "6000m"  # Increased from 2000m (3x) for burst capacity
      memory: "16Gi"  # Increased from 6Gi (2.67x) for heavy workloads

  autoscaling:
    enabled: true
    minReplicas: 1  # Single replica to avoid database lock contention
    maxReplicas: 1  # Lock contention prevents effective multi-pod scaling
    targetCPUUtilizationPercentage: 70  # Lower threshold for faster scaling
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 120  # Increased from 60 for stability
        policies:
        - type: Percent
          value: 100
          periodSeconds: 120  # Increased from 60 for stability
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 120  # Increased from 60 for stability

  podDisruptionBudget:
    enabled: true
    minAvailable: 1  # Reduced from 2 - minimum 1 pod must be available (2 total pods)

  # Node selector removed - allow scheduling on any node for better distribution
  # Backend pods will be distributed across nodes via topologySpreadConstraints below
  # nodeSelector:
  #   postgres-role: worker  # Removed to allow distribution

  # Pod anti-affinity to prefer different nodes (soft requirement)
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100  # High weight to strongly prefer different nodes
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend

  env:
    # Indexer-only mode - API handled by separate backend-api pods
    DISABLE_API: "true"
    INDEXER_MEMORY_LIMIT: "7"  # Increased from 5 for higher memory limit
    LOG_LEVEL: "warn"
    TZDATA_AUTOUPDATE: "disabled"  # Prevent tzdata write errors in read-only container
    INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"  # Disable block reward fetcher
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"  # Disable pending transactions fetcher
    INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"  # Disable internal transactions fetcher
    INDEXER_DISABLE_NFT_MEDIA_HANDLER: "true"  # Disable nft media handler
    NFT_MEDIA_HANDLER_ENABLED: "false"
    NFT_MEDIA_HANDLER_REMOTE_DISPATCHER_NODE_MODE_ENABLED: "false"
    INDEXER_DISABLE_EMPTY_BLOCKS_SANITIZER: "true"  # Disable empty blocks sanitizer
    INDEXER_DISABLE_REPLACED_TRANSACTION_FETCHER: "true"  # Disable for Citus compatibility (FOR UPDATE not supported)
  # Extra environment variables from ExternalSecret
  # Temporarily disable read-only DB URL until replica is healthy.
  extraEnv: []
  #extraEnv:
   # - name: DATABASE_READ_ONLY_API_URL
    #  valueFrom:
    #    secretKeyRef:
    #      name: monad-indexer-production-backend-secret  # ExternalSecret will create this
    #      key: DATABASE_READ_ONLY_API_URL

  config:
    # Database configuration - INCREASED FOR HIGH TPS
    database:
      poolSize: 50  # Increased from 30 - more connections for high TPS Monad mainnet
      poolSizeApi: 70  # Increased from 50 - more API read connections
      replicaMaxLag: "5m"  # Max lag before failback to primary
      queueTarget: "200"  # Increased from 100ms to reduce connection pressure

    # Market data - CoinGecko integration for MON price
    market:
      coingeckoCoinId: "monad"  # https://www.coingecko.com/tr/coins/monad
      coingeckoPlatformId: "monad"  # For token prices on Monad chain (chain_id: 143)
      nativeCoinHistorySource: "coin_gecko"  # Use CoinGecko for price history (not crypto_compare)
      marketCapHistorySource: "coin_gecko"  # Use CoinGecko for market cap history
      # Rate limit friendly settings for CoinGecko free API
      tokensInterval: "20s"  # 10s → 20s (slower batch requests)
      tokensRefetchInterval: "1h"
      coinCachePeriod: "10m"
      tokensMaxBatchSize: "250"  # 500 → 250 (smaller batches)

    # NFT features
    nft:
      mediaHandlerEnabled: false
      remoteDispatcherEnabled: false

    # Indexer performance tuning - OPTIMIZED FOR LOCK CONTENTION
    indexer:
      performance:
        # Coin balances - FURTHER OPTIMIZED to reduce lock contention
        coinBalancesBatchSize: "10"        # Reduced from 20 (smaller batches = less lock duration)
        coinBalancesConcurrency: "2"       # Increased from 1 (more workers but smaller batches)

        # Token balances - FURTHER OPTIMIZED
        tokenBalancesBatchSize: "25"       # Keep at 25 (balanced)
        tokenBalancesConcurrency: "2"      # Keep at 2 (conservative)

        # Catchup blocks
        catchupBlocksBatchSize: "5"       # Reduced from default 10 (smaller transactions)
        catchupBlocksConcurrency: "5"     # Reduced from default 10 (less DB pressure)

        # Internal transactions - Already disabled
        internalTransactionsBatchSize: "5"    # Reduced from default 10
        internalTransactionsConcurrency: "2"  # Reduced from default 4

    # RPC endpoints with fallback
    rpc:
      httpUrl: "https://monad-rpc-mainnet.hoodscan.io"
      fallbackHttpUrl: "https://lb.drpc.live/monad-mainnet/AmQfj8VYakvApG0KMH--gJ_vBnxrylYR8JYxQmlfqV1j"
      traceUrl: "https://monad-rpc-mainnet.hoodscan.io"
      fallbackTraceUrl: "https://lb.drpc.live/monad-mainnet/AmQfj8VYakvApG0KMH--gJ_vBnxrylYR8JYxQmlfqV1j"
      wsUrl: "wss://monad-rpc-mainnet.hoodscan.io/ws/"
      ethCallUrl: "https://monad-rpc-mainnet.hoodscan.io"
      fallbackEthCallUrl: "https://lb.drpc.live/monad-mainnet/AmQfj8VYakvApG0KMH--gJ_vBnxrylYR8JYxQmlfqV1j"
      ethCallUrls: "https://monad-rpc.huginn.tech,https://monad-rpc-mainnet.hoodscan.io"  # Multiple eth_call endpoints for load balancing
      disableArchiveBalances: true  # Disable archive balance queries - RPC doesn't support historical state

    api:
      corsAllowedOrigin: "https://monad.hoodscan.io"

  # Topology spread to distribute backend pods across nodes
  # Ensures balanced distribution: if 2 pods, 1 per node; if 3 pods, 2 on one node, 1 on other
  topologySpreadConstraints:
    - maxSkew: 1  # Max difference between node pod counts
      topologyKey: kubernetes.io/hostname  # Spread across physical nodes
      whenUnsatisfiable: ScheduleAnyway  # Soft requirement - schedule anyway if can't satisfy
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

  # Init containers resource limits (override defaults)
  initContainers:
    dbMigration:
      enabled: true
      resources:
        requests:
          cpu: "500m"  # Increased for faster migrations
          memory: "1Gi"  # Increased from 256Mi - was causing OOM
        limits:
          memory: "2Gi"  # Increased from 512Mi - migrations need more memory with Citus

# Microservices - full HA
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "https://monad.hoodscan.io"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

  sig-provider:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  visualizer:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  stats:
    enabled: true
    replicaCount: 1
    config:
      database:
        runMigrations: true  # Enable migrations on startup
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"

# PostgreSQL - production (single instance for now, scale to 2 when disk space available)
postgresql:
  replicaCount: 1  # Temporarily reduced from 2 to 1 due to disk space constraints

  # Citus image - PostgreSQL 17 with Citus + pg_cron extensions
  # Provides distributed tables, horizontal scaling, and automated partition management
  image:
    registry: ghcr.io
    repository: hoodrunio/postgresql-citus
    tag: "17-citus13.2"  # PostgreSQL 17.5 + Citus 13.1.0 + pg_cron

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-postgresql-app"

  # Ephemeral volumes size limit - shared memory configuration
  # PostgreSQL with shared_buffers=8GB requires ~9GB of shared memory
  ephemeralVolumesSizeLimit:
    shm: "12Gi"  # Set to 12Gi to provide headroom for 8GB shared_buffers

  config:
    # Optimized for high TPS workload
    sharedBuffers: "7GB"  # Increased from 4GB - 8GB caused OOM, 7GB is safe compromise for 86GB transactions table
    effectiveCacheSize: "20GB"  # Adjusted for 7GB shared + ~13GB OS cache (total 24GB RAM available)
    maintenanceWorkMem: "2GB"  # Reduced from 8GB (maintenance operations)
    workMem: "512MB"  # Increased from 256MB - large table sorts need more memory
    maxConnections: "1000"  # Increased from 800 for more connections

    # Shared memory type - use mmap for Kubernetes containers
    # posix uses shm_open() which has issues in containers
    dynamicSharedMemoryType: "mmap"

    # Timeout optimizations for high TPS with Citus
    idle_in_transaction_session_timeout: "30s"
    statement_timeout: "60s"  # Increased for Citus distributed queries
    lock_timeout: "10s"

    # Performance tuning for high TPS
    synchronous_commit: "off"  # Trade durability for performance (safe with WAL archiving)
    wal_buffers: "64MB"  # Increased for high write throughput
    wal_sync_method: "fdatasync"  # Faster than fsync on Linux
    checkpoint_timeout: "15min"  # Increased for less frequent checkpoints
    checkpoint_completion_target: "0.9"  # Spread checkpoint I/O over 90% of checkpoint_timeout
    max_wal_size: "8GB"  # Increased for high write load
    random_page_cost: "1.1"  # Optimized for SSD storage
    effective_io_concurrency: "200"  # Optimized for NVMe storage

    # Lock management
    max_locks_per_transaction: "256"  # Increased for complex transactions
    deadlock_timeout: "1s"  # Fast deadlock detection

    # Additional PostgreSQL parameters
    additionalParameters:
      # WAL retention limit for replication slots - prevents PRIMARY disk exhaustion
      # Without this limit (default: -1/unlimited), WAL files accumulate indefinitely
      # Production issue: 1.8TB of WAL files accumulated on PRIMARY (115K files)
      max_slot_wal_keep_size: "10240"  # 10 GB (in MB) - adequate buffer for replication lag spikes
      # Citus repartition joins - required for advanced-filters API that JOINs distributed tables
      # (token_transfers, transactions, tokens) across different shards
      "citus.enable_repartition_joins": "on"

  primary:
    persistence:
      size: 300Gi  # Increased from 100Gi for long-term data retention
      storageClass: "fast-ssd"  # Use high-performance NVMe storage
    resources:
      requests:
        cpu: "3000m"  # Balanced for 12-core node with other workloads
        memory: "24Gi"  # Optimized for shared_buffers=8GB with room for OS cache
      limits:
        cpu: "8000m"  # Can burst up to 8 cores when needed
        memory: "40Gi"  # Limit under node capacity for safety

    # Node affinity to schedule on primary node
    nodeSelector:
      postgres-role: primary

  backup:
    enabled: false  # Temporarily disabled - S3 bucket being cleaned
    retentionPolicy: "7d"
    secretName: "postgres-backup-creds"
    schedule: "0 3 * * *"  # Daily at 3 AM UTC
    backupOwnerReference: "self"
    barmanObjectStore:
      destinationPath: "s3://monad-testnet-archive/postgresql"
      endpointURL: "https://nbg1.your-objectstorage.com"
      s3Credentials:
        accessKeyId:
          name: "postgres-backup-creds"
          key: "ACCESS_KEY_ID"
        secretAccessKey:
          name: "postgres-backup-creds"
          key: "SECRET_ACCESS_KEY"
      wal:
        compression: gzip
        maxParallel: 2

  # Replica configuration
  readReplicas:
    enabled: true
    replicaCount: 1
    persistence:
      size: 300Gi  # Matched with primary
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "3000m"  # Increased for node2 (125GB RAM worker node)
        memory: "24Gi"  # Increased - node2 has 66GB available
      limits:
        cpu: "8000m"  # Can burst up to 8 cores (node2 has more resources)
        memory: "40Gi"  # Matching primary for consistency

    # Node affinity to schedule on node2 (primary node - 128GB RAM)
    # Node2: 128GB RAM, optimized for read-heavy workload
    nodeSelector:
      postgres-role: primary  # node2 (labeled as primary)

  # Citus configuration - distributed PostgreSQL with horizontal scaling
  citus:
    enabled: true

  # Database maintenance jobs
  maintenance:
    # One-time job: Drop unused indexes (runs during helm upgrade/install)
    dropUnusedIndexes:
      enabled: false  # Disabled during Citus migration

    # Recurring job: Index maintenance (monitors and drops unused indexes)
    indexMaintenance:
      enabled: false  # Enable for ongoing maintenance (optional)
      schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM UTC

  pooler:
    enabled: true
    useForBackend: true  # Route backend connections through pooler (best practice)
    replicaCount: 3  # High availability
    poolMode: "transaction"  # Release connection after each transaction
    maxClientConn: 10000  # High - allows many client connections
    defaultPoolSize: 150  # Increased from 100 - high TPS Monad mainnet needs more connections
    maxDbConnections: 200  # Increased from 150 - total capacity: 3×200=600 connections
    reservePoolSize: 10   # Increased emergency buffer from 5

    # Timeouts
    serverIdleTimeout: 300        # Recycle idle connections
    serverLifetime: 1800          # Refresh connections every 30 minutes
    serverConnectTimeout: 10      # Fail fast on connection issues
    queryTimeout: 300             # Allow complex queries
    queryWaitTimeout: 120         # PHASE 1 FIX: Restored to 120s from 60s - was causing retry storms
    logConnections: 1
    logDisconnections: 1

    resources:
      requests:
        cpu: "500m"  # Increased from 200m - higher pool size needs more CPU
        memory: "1Gi"  # Increased from 512Mi - more connections need more memory
      limits:
        memory: "2Gi"  # Increased from 1Gi - safety margin for connection overhead

    # Node selector to place pooler pods on node1 (now safe with fixed anti-affinity)
    nodeSelector:
      postgres-role: primary  # Schedule pooler on node1 with postgresql-1

  # Read-Only Pooler - NEW: For API read queries to use replica
  readOnlyPooler:
    enabled: false  # Enable RO pooler for read replica
    replicaCount: 1  # Fewer instances than RW (reads are lighter)
    poolMode: "transaction"  # Connection multiplexing for API queries
    maxClientConn: 5000  # High - API generates many short-lived connections
    defaultPoolSize: 20  # Small pool - read queries are fast (2 poolers × 20 = 40 to replica)
    maxDbConnections: 40  # 2x default for burst capacity (2 poolers × 40 = 80 max to replica)
    reservePoolSize: 5  # Small emergency buffer

    # Timeouts - aggressive for fast read queries
    serverIdleTimeout: 300  # Shorter than RW (reads complete quickly)
    serverLifetime: 1800  # 30min lifecycle
    serverConnectTimeout: 10  # Fast connect timeout
    queryTimeout: 60  # Aggressive timeout for reads (vs 300 for writes)
    queryWaitTimeout: 30  # Fast fail if pool exhausted
    logConnections: 1
    logDisconnections: 1

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "512Mi"

    # Co-locate with replica on node2 (primary node - 128GB RAM)
    nodeSelector:
      postgres-role: primary  # Schedule on node2 (labeled as primary)

  # Citus Worker Configuration - Distributed PostgreSQL Worker Node
  # This worker runs on ubuntu node (64GB RAM) to distribute data load
  citusWorker:
    enabled: true
    replicaCount: 1  # Single worker on ubuntu node

    # Worker persistence
    persistence:
      size: 200Gi  # Smaller than primary (will hold ~50% of shards)
      storageClass: "fast-ssd"  # Same as primary for consistency

    # Worker resources - optimized for ubuntu node (64GB RAM)
    resources:
      requests:
        cpu: "2000m"  # 2 cores baseline
        memory: "16Gi"  # Conservative for shared node with backend
      limits:
        cpu: "6000m"  # Can burst up to 6 cores
        memory: "32Gi"  # Leave room for backend and indexer pods

    # Ephemeral volumes size limit - shared memory configuration
    ephemeralVolumesSizeLimit:
      shm: "8Gi"  # Shared memory for 6GB shared_buffers + headroom

    # Worker-specific PostgreSQL configuration
    config:
      sharedBuffers: "6GB"  # Smaller than coordinator (16GB RAM request)
      effectiveCacheSize: "18GB"  # Estimated OS cache + shared buffers
      maintenanceWorkMem: "2GB"  # Same as coordinator
      workMem: "512MB"  # Same as coordinator
      maxConnections: "300"  # Fewer than coordinator (enough for shard queries)

    # Node selector - schedule on ubuntu node
    nodeSelector:
      postgres-role: worker  # ubuntu-2204-jammy-amd64-base node

    # No tolerations needed (standard node)
    tolerations: []

    # Pod anti-affinity - not needed (single worker)
    affinity: {}

  # Node selector for PostgreSQL pods - schedule on node2 (128GB RAM)
  nodeSelector:
    postgres-role: primary

  # Disable pod anti-affinity for local storage compatibility
  affinity:
    enablePodAntiAffinity: false  # Disabled to avoid conflicts with local storage PVC node affinity

  # Use topology spread constraints (modern Kubernetes best practice)
  # This provides soft distribution across nodes without blocking on local storage
  topologySpreadConstraints:
    - maxSkew: 1  # Allow max 1 pod difference between nodes
      topologyKey: kubernetes.io/hostname  # Distribute across nodes
      whenUnsatisfiable: ScheduleAnyway  # Soft constraint - schedule even if spread not perfect
      labelSelector:
        matchLabels:
          cnpg.io/podRole: instance  # Only spread instance pods, not pooler

# Redis - production HA
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  # Override sentinel and metrics images to use latest tags
  sentinel:
    enabled: true
    quorum: 2
    image:
      tag: "latest"
  metrics:
    enabled: true
    image:
      tag: "latest"
  master:
    persistence:
      size: 100Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "200m"  # Reduced for single-node cluster
        memory: "1Gi"  # Reduced for single-node cluster
      limits:
        memory: "4Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}
  replica:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"  # Reduced for single-node cluster
        memory: "512Mi"  # Reduced for single-node cluster
      limits:
        memory: "2Gi"
    # Disable anti-affinity for single-node cluster
    affinity: {}

# Monitoring - full stack
monitoring:
  enabled: false
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 15s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Network policies - strict
networkPolicies:
  enabled: true
  defaultDeny: true
  enableCiliumPolicies: false  # Disabled due to validation errors

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: monad-mainnet-indexer.hoodscan.io
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: monad-indexer-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 2s
  # Production rate limiting
  rateLimit:
    enabled: true
    requestsPerSecond: 1000
    burst: 2000

# Stats PostgreSQL (if enabled)
statsPostgresql:
  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-stats-postgresql-app"

  # Node selector to place stats database on node2 (free up 1-2GB on node1)
  # Node2: 125GB RAM worker node - analytics database co-located with stats microservice
  primary:
    nodeSelector:
      postgres-role: primary  # node2 (worker)

# External Secrets configuration for production environment
externalSecrets:
  enabled: true
  aws:
    secretName: "blockscout"  # Shared secret for all environments

# ============================================================
# BACKEND API - Read-only API pods (separate from indexer)
# ============================================================
backendApi:
  enabled: true
  replicaCount: 1

  config:
    database:
      poolSize: 30      # Lower than indexer
      poolSizeApi: 50   # Higher for API queries

    # API Rate Limiting
    rateLimit:
      global: "2000"           # Global: 2000 req/sec
      byIp: "150"              # Per IP: 30 req/min
      byIpTimeInterval: "1m"
      behindProxy: "true"     # Behind Cilium Gateway

  env:
    LOG_LEVEL: "warn"
    TZDATA_AUTOUPDATE: "disabled"

  resources:
    requests:
      cpu: "2000m"
      memory: "2Gi"
    limits:
      cpu: "3000m"
      memory: "4Gi"

  # HPA disabled by default - enable when needed
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
