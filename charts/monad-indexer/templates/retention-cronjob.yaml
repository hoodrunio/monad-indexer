{{- if .Values.retention.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "monad-indexer.fullname" . }}-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.retention.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.retention.failedJobsHistoryLimit }}
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  startingDeadlineSeconds: 3600  # Allow 1 hour late start
  jobTemplate:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: retention
    spec:
      backoffLimit: 2  # Retry twice on failure
      activeDeadlineSeconds: {{ .Values.retention.jobTimeoutSeconds }}
      template:
        metadata:
          labels:
            {{- include "monad-indexer.labels" . | nindent 12 }}
            app.kubernetes.io/component: retention
          annotations:
            prometheus.io/scrape: "false"  # Don't scrape job pods
        spec:
          serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- with .Values.retention.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.retention.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: data-retention
            image: {{ .Values.retention.image.repository }}:{{ .Values.retention.image.tag }}
            imagePullPolicy: {{ .Values.retention.image.pullPolicy }}
            env:
            - name: PGHOST
              value: {{ include "monad-indexer.fullname" . }}-postgresql-pooler-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "monad-indexer.fullname" . }}-postgresql-app
                  key: username
                  optional: false
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monad-indexer.fullname" . }}-postgresql-app
                  key: password
                  optional: false
            - name: RETENTION_DAYS
              value: {{ .Values.retention.retentionDays | quote }}
            - name: BATCH_SIZE
              value: {{ .Values.retention.batchSize | quote }}
            - name: DRY_RUN
              value: {{ .Values.retention.dryRun | quote }}
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Colors for output
              RED='\033[0;31m'
              GREEN='\033[0;32m'
              YELLOW='\033[1;33m'
              NC='\033[0m' # No Color

              echo "=================================================="
              echo "Monad Indexer Data Retention Job"
              echo "=================================================="
              echo "Started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "Retention period: ${RETENTION_DAYS} days"
              echo "Batch size: ${BATCH_SIZE}"
              echo "Dry run: ${DRY_RUN}"
              echo "=================================================="
              echo ""

              # Function to execute SQL and log results
              execute_sql() {
                local description="$1"
                local sql="$2"

                echo -e "${YELLOW}[INFO]${NC} ${description}..."

                if [[ "${DRY_RUN}" == "true" ]]; then
                  echo -e "${YELLOW}[DRY RUN]${NC} Would execute: ${sql}"
                  return 0
                fi

                local start_time=$(date +%s)
                local result

                if result=$(psql -v ON_ERROR_STOP=1 -t -c "${sql}" 2>&1); then
                  local end_time=$(date +%s)
                  local duration=$((end_time - start_time))
                  echo -e "${GREEN}[SUCCESS]${NC} ${description} completed in ${duration}s"
                  echo "Result: ${result}"
                  echo ""
                  return 0
                else
                  echo -e "${RED}[ERROR]${NC} ${description} failed"
                  echo "Error: ${result}"
                  return 1
                fi
              }

              # Function to get count before deletion
              get_count() {
                local table="$1"
                local cutoff_date="NOW() - INTERVAL '${RETENTION_DAYS} days'"

                local sql="SELECT COUNT(*) FROM ${table} WHERE inserted_at < ${cutoff_date}"
                psql -t -c "${sql}" | tr -d ' '
              }

              # Check database connectivity
              echo -e "${YELLOW}[INFO]${NC} Testing database connection..."
              if ! psql -c "SELECT version();" > /dev/null 2>&1; then
                echo -e "${RED}[ERROR]${NC} Failed to connect to database"
                exit 1
              fi
              echo -e "${GREEN}[SUCCESS]${NC} Database connection successful"
              echo ""

              # Get current data statistics
              echo "=================================================="
              echo "Current Data Statistics"
              echo "=================================================="
              execute_sql "Getting oldest block timestamp" \
                "SELECT MIN(inserted_at) as oldest_block FROM blocks"

              execute_sql "Getting total block count" \
                "SELECT COUNT(*) as total_blocks FROM blocks"

              execute_sql "Getting total transaction count" \
                "SELECT COUNT(*) as total_transactions FROM transactions"

              execute_sql "Getting total logs count" \
                "SELECT COUNT(*) as total_logs FROM logs"

              echo "=================================================="
              echo "Data to be deleted (older than ${RETENTION_DAYS} days)"
              echo "=================================================="

              # Count records to be deleted
              BLOCKS_TO_DELETE=$(get_count "blocks")
              TRANSACTIONS_TO_DELETE=$(get_count "transactions")
              LOGS_TO_DELETE=$(get_count "logs")
              TOKEN_TRANSFERS_TO_DELETE=$(get_count "token_transfers")

              echo "Blocks: ${BLOCKS_TO_DELETE}"
              echo "Transactions: ${TRANSACTIONS_TO_DELETE}"
              echo "Logs: ${LOGS_TO_DELETE}"
              echo "Token transfers: ${TOKEN_TRANSFERS_TO_DELETE}"
              echo ""

              # Check if there's anything to delete
              TOTAL_TO_DELETE=$((BLOCKS_TO_DELETE + TRANSACTIONS_TO_DELETE + LOGS_TO_DELETE + TOKEN_TRANSFERS_TO_DELETE))

              if [[ ${TOTAL_TO_DELETE} -eq 0 ]]; then
                echo -e "${GREEN}[INFO]${NC} No data to delete. All data is within retention period."
                echo "Job completed successfully at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
                exit 0
              fi

              echo -e "${YELLOW}[WARNING]${NC} Total records to delete: ${TOTAL_TO_DELETE}"
              echo ""

              # Start deletion process
              echo "=================================================="
              echo "Starting Deletion Process"
              echo "=================================================="

              # Set statement timeout to prevent long-running queries
              execute_sql "Setting statement timeout" \
                "SET statement_timeout = '30min'"

              # Delete in proper order to respect foreign key constraints
              # Order: token_transfers -> logs -> internal_transactions -> transactions -> blocks

              if [[ ${TOKEN_TRANSFERS_TO_DELETE} -gt 0 ]]; then
                echo -e "${YELLOW}[STEP 1/5]${NC} Deleting old token transfers..."
                execute_sql "Deleting token transfers" \
                  "DELETE FROM token_transfers
                   WHERE inserted_at < NOW() - INTERVAL '${RETENTION_DAYS} days'"
              fi

              if [[ ${LOGS_TO_DELETE} -gt 0 ]]; then
                echo -e "${YELLOW}[STEP 2/5]${NC} Deleting old logs..."
                execute_sql "Deleting logs" \
                  "DELETE FROM logs
                   WHERE inserted_at < NOW() - INTERVAL '${RETENTION_DAYS} days'"
              fi

              # Internal transactions (may not have inserted_at, use transaction reference)
              echo -e "${YELLOW}[STEP 3/5]${NC} Deleting old internal transactions..."
              execute_sql "Deleting internal transactions" \
                "DELETE FROM internal_transactions
                 WHERE transaction_hash IN (
                   SELECT hash FROM transactions
                   WHERE inserted_at < NOW() - INTERVAL '${RETENTION_DAYS} days'
                 )"

              if [[ ${TRANSACTIONS_TO_DELETE} -gt 0 ]]; then
                echo -e "${YELLOW}[STEP 4/5]${NC} Deleting old transactions..."
                execute_sql "Deleting transactions" \
                  "DELETE FROM transactions
                   WHERE inserted_at < NOW() - INTERVAL '${RETENTION_DAYS} days'"
              fi

              if [[ ${BLOCKS_TO_DELETE} -gt 0 ]]; then
                echo -e "${YELLOW}[STEP 5/5]${NC} Deleting old blocks..."
                execute_sql "Deleting blocks" \
                  "DELETE FROM blocks
                   WHERE inserted_at < NOW() - INTERVAL '${RETENTION_DAYS} days'"
              fi

              # Vacuum tables to reclaim disk space
              echo ""
              echo "=================================================="
              echo "Reclaiming Disk Space"
              echo "=================================================="

              execute_sql "Vacuuming token_transfers" \
                "VACUUM ANALYZE token_transfers"

              execute_sql "Vacuuming logs" \
                "VACUUM ANALYZE logs"

              execute_sql "Vacuuming internal_transactions" \
                "VACUUM ANALYZE internal_transactions"

              execute_sql "Vacuuming transactions" \
                "VACUUM ANALYZE transactions"

              execute_sql "Vacuuming blocks" \
                "VACUUM ANALYZE blocks"

              # Final statistics
              echo ""
              echo "=================================================="
              echo "Final Statistics"
              echo "=================================================="
              execute_sql "Getting remaining block count" \
                "SELECT COUNT(*) as remaining_blocks FROM blocks"

              execute_sql "Getting remaining transaction count" \
                "SELECT COUNT(*) as remaining_transactions FROM transactions"

              execute_sql "Getting database size" \
                "SELECT pg_size_pretty(pg_database_size(current_database())) as database_size"

              echo "=================================================="
              echo "Data Retention Job Completed Successfully"
              echo "=================================================="
              echo "Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "Records deleted:"
              echo "  - Blocks: ${BLOCKS_TO_DELETE}"
              echo "  - Transactions: ${TRANSACTIONS_TO_DELETE}"
              echo "  - Logs: ${LOGS_TO_DELETE}"
              echo "  - Token transfers: ${TOKEN_TRANSFERS_TO_DELETE}"
              echo "  - Total: ${TOTAL_TO_DELETE}"
              echo "=================================================="

            resources:
              {{- toYaml .Values.retention.resources | nindent 14 }}
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 999  # postgres user
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
          securityContext:
            fsGroup: 999
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
{{- end }}
