# ArgoCD Root Application for Development Environment
# App-of-Apps Pattern - deploys only dev applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monad-indexer-root-dev
  namespace: argocd
  # Finalizers ensure proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hoodrunio/monad-indexer
    targetRevision: dev  # Dev environment uses dev branch
    path: argocd/applications/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
