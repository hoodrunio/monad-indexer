# ReferenceGrant - Allow Gateway in monad-indexer-dev to reference ArgoCD service in argocd namespace
# Required for cross-namespace HTTPRoute

apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-to-gateway
  namespace: argocd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: ""
      kind: Service
      name: argocd-server
