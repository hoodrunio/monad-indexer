# Monad Indexer Helm Chart - Base Values
# This file contains production-baseline configuration
# Override with environment-specific values files (values-dev.yaml, values-staging.yaml, values-production.yaml)

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Namespace override
namespaceOverride: ""

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ============================================================
# BACKEND (Blockscout Indexer + API)
# ============================================================
backend:
  enabled: true
  replicaCount: 2

  image:
    registry: ghcr.io
    repository: blockscout/blockscout
    tag: "9.0.2"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Configuration structure (mapped to ConfigMap)
  config:
    # Database configuration
    database:
      ectoUseSsl: false
      poolSize: 80
      poolSizeApi: 10

    # RPC endpoints
    rpc:
      variant: "geth"
      transport: "http"
      httpUrl: "https://testnet-rpc.monad.xyz"
      traceUrl: ""  # Defaults to httpUrl if empty
      wsUrl: "wss://testnet-rpc.monad.xyz"
      disableArchiveBalances: false

    # Chain configuration
    chain:
      id: "10143"

    # API server configuration
    api:
      disableWebapp: true
      adminPanelEnabled: false
      v1ReadMethodsDisabled: false
      v1WriteMethodsDisabled: false
      v2Enabled: true

    # Frontend configuration (if webapp is enabled)
    frontend:
      webappUrl: ""
      enableRustVerificationService: true

    # Market data
    market:
      coinName: "MON"
      coin: "MON"
      disabled: false

    # Microservices integration
    microservices:
      verifier:
        type: "eth_bytecode_db"

    # Redis configuration
    redis:
      enabled: true

    # Account features
    account:
      enabled: false
      cloakKey: ""

    # Indexer configuration
    indexer:
      disabled: false
      disableRealtime: false
      disableCatchup: true
      memoryLimit: "5"
      disablePendingTransactionsFetcher: false
      blockTransformer: "base"
      # Performance tuning (optional - uncomment to use)
      performance: {}

    # Performance tuning
    performance:
      disableExchangeRates: true
      disableReadApi: false
      disableWriteApi: false

    # History mode
    history:
      fetchInternalTransactions: true

    # Contract verification
    contract:
      allowedSolcVersions: "all"
      allowedVyperVersions: "all"

    # NFT features
    nft:
      mediaHandlerEnabled: true

    # Logging
    logging:
      consoleFormat: "json"
      consoleLevel: "info"

    # reCAPTCHA (disabled)
    recaptcha:
      enabled: false

    # Advanced features
    advanced:
      cacheAddressWithBalancesUpdateInterval: "30"
      cacheBlockCountPeriod: "7200"

  # Secret configuration
  secret:
    annotations: {}
    secretKeyBase: ""  # Will use placeholder if empty

  # Existing secret for sensitive data (use sealed secrets in production)
  # If set, the chart will not create a secret and will use this instead
  # Generate with: make seal-secrets
  existingSecret: "monad-indexer-backend-secret"

  # Extra environment variables (for values not in config structure)
  extraEnv: []

  # Container command (Elixir release start)
  command: ["/app/bin/blockscout"]
  args: ["start"]

  # Service configuration
  service:
    type: ClusterIP
    port: 4000
    annotations: {}

  # Resource configuration
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      memory: "8Gi"
      # NO CPU LIMIT - avoid throttling

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Probes
  startupProbe:
    enabled: true
    httpGet:
      path: /api/v2/stats
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30  # 5 minutes for initial sync
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: /api/v2/stats
      port: http
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v2/stats
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  # Lifecycle hooks
  lifecycle:
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 15"]

  # Init containers
  initContainers:
    dbMigration:
      enabled: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          memory: "512Mi"
    waitForPostgres:
      enabled: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
    waitForRedis:
      enabled: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"

  # Pod anti-affinity for HA
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - backend
            topologyKey: kubernetes.io/hostname

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Topology spread constraints
  topologySpreadConstraints: []

  # Persistence (for logs, cache, etc.)
  persistence:
    enabled: false
    mountPath: /app/data

  # Extra volumes and volume mounts
  extraVolumes: []
  extraVolumeMounts: []

  # Existing secret for sensitive data
  existingSecret: ""

# ============================================================
# MICROSERVICES
# ============================================================
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 2
    image:
      registry: ghcr.io
      repository: blockscout/smart-contract-verifier
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8051  # Changed from 8050 to 8051
    config:
      server:
        http:
          enabled: true
          maxBodySize: 2097152
          cors:
            enabled: true
            allowedOrigin: "*"
        grpc:
          enabled: false
      logging:
        rustLog: "info,smart_contract_verifier=debug"
      solidity:
        enabled: true
        compilersDir: "/tmp/solidity-compilers"
        refreshVersionsSchedule: "0 0 * * * * *"
        fetcher:
          listUrl: "https://solc-bin.ethereum.org/linux-amd64/list.json"
      vyper:
        enabled: true
        compilersDir: "/tmp/vyper-compilers"
        refreshVersionsSchedule: "0 0 * * * * *"
        fetcher:
          listUrl: "https://raw.githubusercontent.com/blockscout/solc-bin/main/vyper.list.json"
      sourcify:
        enabled: true
        apiUrl: "https://sourcify.dev/server/"
        verificationAttempts: 3
        requestTimeout: 10
      metrics:
        enabled: false
      jaeger:
        enabled: false
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    env: {}
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10

  sig-provider:
    enabled: true
    replicaCount: 2
    image:
      registry: ghcr.io
      repository: blockscout/sig-provider
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8050
    config:
      server:
        http:
          enabled: true
          cors:
            enabled: true
            allowedOrigin: "*"
        grpc:
          enabled: false
      logging:
        rustLog: "info,sig_provider=debug"
      metrics:
        enabled: true
        addr: "0.0.0.0:6060"
        route: "/metrics"
      tracing:
        enabled: false
      jaeger:
        enabled: false
      sources:
        fourbyte: "https://www.4byte.directory/"
        sigeth: "https://api.openchain.xyz/"
        ethBytecodeDb:
          enabled: true
          url: "https://eth-bytecode-db.services.blockscout.com/"
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
    autoscaling:
      enabled: false
    env: {}

  visualizer:
    enabled: true
    replicaCount: 1
    image:
      registry: ghcr.io
      repository: blockscout/visualizer
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8050
    config:
      server:
        grpc:
          enabled: false
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
    autoscaling:
      enabled: false
    env: {}

  stats:
    enabled: true
    replicaCount: 1
    image:
      registry: ghcr.io
      repository: blockscout/stats
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8050
    config:
      server:
        http:
          enabled: true
          maxBodySize: 2097152
        grpc:
          enabled: false
      database:
        createDatabase: false
        runMigrations: false
      schedule:
        default: "0 0 1 * * * *"  # Daily at 1 AM
        forceUpdateOnStart: false
      metrics:
        enabled: false
      tracing:
        enabled: true
        format: "default"
      jaeger:
        enabled: false
    secret:
      annotations: {}
    existingSecret: ""
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    autoscaling:
      enabled: false
    env: {}

# ============================================================
# POSTGRESQL (CloudNativePG)
# ============================================================
postgresql:
  enabled: true
  replicaCount: 3  # 1 primary + 2 read replicas

  image:
    registry: ghcr.io
    repository: cloudnative-pg/postgresql
    tag: "17"

  auth:
    database: blockscout
    username: blockscout
    password: ""  # Leave empty when using sealed secrets
    # Use sealed secret by default (generate with: make seal-secrets)
    existingSecret: "monad-indexer-postgresql-app"

  # PostgreSQL configuration (optimized for 5k TPS)
  config:
    sharedBuffers: "8GB"
    effectiveCacheSize: "24GB"
    maintenanceWorkMem: "2GB"
    workMem: "128MB"
    walBuffers: "64MB"
    minWalSize: "2GB"
    maxWalSize: "8GB"
    synchronousCommit: "off"  # CRITICAL for performance
    checkpointTimeout: "15min"
    checkpointCompletionTarget: "0.9"
    maxWalSenders: "10"
    maxConnections: "500"
    clientConnectionCheckInterval: "60000"  # 60 seconds - connection health check
    randomPageCost: "1.1"  # For NVMe SSD
    effectiveIoConcurrency: "200"
    logMinDurationStatement: "1000"  # Log queries > 1s
    logConnections: "on"
    logDisconnections: "on"
    additionalParameters: {}

  # Primary instance
  primary:
    persistence:
      enabled: true
      storageClass: ""  # Use default or override
      size: 500Gi
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
      limits:
        memory: "32Gi"

  # Backup configuration
  backup:
    enabled: false  # Enable and configure S3 path in production
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://backup-bucket/monad-indexer"  # Configure for production
      s3Credentials:
        accessKeyId:
          name: postgres-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 8

  # Replication slots
  replicationSlots:
    enabled: true
    updateInterval: 300

  # Failover configuration
  failover:
    delay: 0
    switchoverDelay: 60

  # Monitoring
  monitoring:
    enabled: true
    enablePodMonitor: true

  # PgBouncer connection pooler
  pooler:
    enabled: true
    replicaCount: 2
    type: "rw"  # read-write
    poolMode: "transaction"
    maxClientConn: 2000
    defaultPoolSize: 50
    reservePoolSize: 25
    reservePoolTimeout: 5
    maxDbConnections: 100
    maxUserConnections: 100
    serverIdleTimeout: 600
    serverLifetime: 3600
    serverConnectTimeout: 15
    queryTimeout: 300
    queryWaitTimeout: 120
    logConnections: 1
    logDisconnections: 1
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  # Affinity configuration (CloudNativePG format)
  # nodeSelector and tolerations must be inside affinity section
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: "required"  # or "preferred"
    topologyKey: "kubernetes.io/hostname"
    # Additional custom affinity rules
    # Note: cnpg.io/cluster label is automatically set by CloudNativePG
    # The value is the cluster name ({{ include "monad-indexer.fullname" . }}-postgresql)
    additionalPodAntiAffinity: {}

  nodeSelector: {}
  tolerations: []

  # Security configuration
  # Note: CloudNativePG manages podSecurityContext and containerSecurityContext automatically
  # Only seccompProfile can be customized
  seccompProfile:
    type: RuntimeDefault

# ============================================================
# REDIS (Bitnami subchart)
# ============================================================
redis:
  enabled: true
  architecture: replication  # master-replica with Sentinel
  auth:
    enabled: true
    password: ""  # Set via external secret
    existingSecret: ""
  sentinel:
    enabled: true
    quorum: 2
  master:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        memory: "4Gi"
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        memory: "2Gi"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ============================================================
# EXTERNAL SERVICES (when using managed databases)
# ============================================================
externalDatabase:
  enabled: false
  url: ""
  existingSecret: ""

externalRedis:
  enabled: false
  url: ""
  existingSecret: ""

# ============================================================
# MONITORING
# ============================================================
monitoring:
  enabled: true
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# ============================================================
# NETWORK POLICIES
# ============================================================
networkPolicies:
  enabled: true
  defaultDeny: true
  # Enable Cilium-specific NetworkPolicies (optional, requires Cilium CNI)
  # These policies provide enhanced L3/L4 capabilities and better performance
  # Standard Kubernetes NetworkPolicies are always used regardless of this setting
  enableCiliumPolicies: false

# ============================================================
# STATS POSTGRESQL (Separate database for stats service)
# ============================================================
statsPostgresql:
  enabled: true
  replicaCount: 1  # Stats doesn't need HA

  image:
    registry: ghcr.io
    repository: cloudnative-pg/postgresql
    tag: "17"

  auth:
    database: stats
    username: stats
    password: ""  # Leave empty when using sealed secrets
    # Use sealed secret by default (generate with: make seal-secrets)
    existingSecret: "monad-indexer-stats-postgresql-app"

  # Storage configuration (smaller than main DB)
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 50Gi  # Stats data is much smaller
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

# ============================================================
# INGRESS
# ============================================================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: indexer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
