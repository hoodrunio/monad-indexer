{{- if and .Values.gateway.enabled (index .Values.microservices "stats").enabled -}}
---
# HTTPRoute - Routes HTTP traffic to stats service
# Exposes /stats/* path prefix to stats microservice
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monad-indexer.fullname" . }}-stats
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: stats
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- else }}
      namespace: {{ .Release.Namespace }}
      {{- end }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName }}
      {{- end }}
  hostnames:
    {{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /stats
      backendRefs:
        - name: {{ include "monad-indexer.fullname" . }}-stats
          port: {{ (index .Values.microservices "stats").service.port }}
          weight: 100
      {{- if .Values.gateway.timeout }}
      timeouts:
        request: {{ .Values.gateway.timeout }}
      {{- end }}
{{- end }}
