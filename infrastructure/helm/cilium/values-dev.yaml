# Cilium Development Configuration for Monad Indexer
# Optimized for local development and debugging
# Version: 1.18.3

# IPAM Configuration - Match K3s default pod CIDR
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"

# Kube-proxy Replacement
kubeProxyReplacement: "true"

# API Server Access
# For Docker Desktop/local K3s, usually localhost or 127.0.0.1
k8sServiceHost: "65.21.183.30"
k8sServicePort: "6443"

# Native Routing
routingMode: "native"

# Load Balancer Configuration
loadBalancer:
  acceleration: "native"
  mode: "hybrid"
  serviceTopology: true

# L2 Announcements
l2announcements:
  enabled: true

# BGP - Disabled for dev
bgpControlPlane:
  enabled: false

# Hubble Observability - ENABLED for development/debugging
# Provides network visibility and troubleshooting capabilities
hubble:
  enabled: true

  # Hubble Relay - Required for hubble CLI and UI
  relay:
    enabled: true
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  # Hubble UI - Web interface for network flows visualization
  ui:
    enabled: true
    ingress:
      enabled: false  # Set to true and configure ingress if needed
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Hubble metrics for Prometheus
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http

# BPF Configuration
bpf:
  # Enable trace events for debugging
  events:
    trace:
      enabled: true  # Enabled for dev debugging

  # Standard queue size for dev
  eventsQueueSize: 16384  # Default size

  # Lower connection limits for dev
  ctMax: 131072  # Half of production
  natMax: 262144  # Half of production

# BIG TCP - Disabled for dev (local traffic)
enableIPv4BIGTCP: false
enableIPv6BIGTCP: false

# Node-local DNS
nodeLocalDNS:
  enabled: false  # Not needed for local dev

# Monitoring
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false  # Disable if Prometheus operator not installed in dev

# Operator Configuration
operator:
  replicas: 1

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

  # Lower resource limits for dev
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Cilium Agent - Lower resource limits for dev
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Security
policyEnforcementMode: "default"

# Host firewall
hostFirewall:
  enabled: false

# Bandwidth Manager
bandwidthManager:
  enabled: false  # Not needed for local dev

# IPv4/IPv6
ipv4:
  enabled: true
ipv6:
  enabled: false

# Encryption - Disabled for dev (adds latency)
encryption:
  enabled: false

# Debug Logging - ENABLED for development
debug:
  enabled: true
  # Verbose logging for troubleshooting

# Auto-direct node routes
autoDirectNodeRoutes: true

# Tunnel protocol
tunnelProtocol: ""

# Cluster config
cluster:
  name: monad-indexer-dev
  id: 0

# Rollout configuration
rollOutCiliumPods: true

# Metrics
enableRuntimeMetrics: true
enableMetrics: true

# Additional dev-specific settings
# Wait longer for endpoints to be ready (helpful for slow dev machines)
endpointHealthChecking:
  enabled: true

# Enable connectivity health checks
healthChecking: true
