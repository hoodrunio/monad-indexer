# Staging Environment Configuration
# Production-like but smaller scale

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-staging-backend-secret"

  replicaCount: 2

  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      memory: "4Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  env:
    LOG_LEVEL: "info"

  config:
    # RPC endpoints with fallback
    rpc:
      httpUrl: "https://testnet-rpc.monad.xyz"
      fallbackHttpUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"
      traceUrl: "https://testnet-rpc.monad.xyz"
      fallbackTraceUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"
      wsUrl: "wss://testnet-rpc.monad.xyz"
      ethCallUrl: "https://testnet-rpc.monad.xyz"
      fallbackEthCallUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"

    api:
      corsAllowedOrigin: "https://testnet.monad.hoodscan.io,https://monad.hoodscan.io"

# Microservices - enabled with moderate resources
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 2
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "https://testnet.monad.hoodscan.io,https://monad.hoodscan.io"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
  sig-provider:
    enabled: true
    replicaCount: 1
  visualizer:
    enabled: true
    replicaCount: 1
  stats:
    enabled: true
    replicaCount: 1

# PostgreSQL - HA setup
postgresql:
  replicaCount: 3

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-staging-postgresql-app"

  config:
    sharedBuffers: "4GB"
    effectiveCacheSize: "12GB"
    maintenanceWorkMem: "1GB"
    maxConnections: "300"

  primary:
    persistence:
      size: 200Gi
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
      limits:
        memory: "16Gi"

  backup:
    enabled: true
    retentionPolicy: "7d"

  pooler:
    enabled: true
    replicaCount: 2

# Redis - HA setup
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  replica:
    replicaCount: 2
  sentinel:
    enabled: true
  master:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

# Monitoring - enabled
monitoring:
  enabled: true

# Network policies - enabled
networkPolicies:
  enabled: true
  enableCiliumPolicies: false  # Optional: set to true for enhanced Cilium policies

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: indexer-staging.example.com
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: indexer-staging-tls
    clusterIssuer: letsencrypt-staging
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 1s

# Stats PostgreSQL (if enabled)
statsPostgresql:
  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-staging-stats-postgresql-app"

# External Secrets configuration for staging environment
externalSecrets:
  enabled: true
  aws:
    secretName: "blockscout-staging"  # Separate secret for staging
