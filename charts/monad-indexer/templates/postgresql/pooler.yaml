{{- if and .Values.postgresql.enabled .Values.postgresql.pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "monad-indexer.fullname" . }}-pooler
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  cluster:
    name: {{ include "monad-indexer.fullname" . }}-postgresql

  instances: {{ .Values.postgresql.pooler.replicaCount | default 2 }}
  type: {{ .Values.postgresql.pooler.type | default "rw" }}

  # PgBouncer configuration
  pgbouncer:
    poolMode: {{ .Values.postgresql.pooler.poolMode | default "transaction" }}
    parameters:
      # Connection limits
      max_client_conn: {{ .Values.postgresql.pooler.maxClientConn | default "2000" | quote }}
      default_pool_size: {{ .Values.postgresql.pooler.defaultPoolSize | default "50" | quote }}
      reserve_pool_size: {{ .Values.postgresql.pooler.reservePoolSize | default "25" | quote }}
      reserve_pool_timeout: {{ .Values.postgresql.pooler.reservePoolTimeout | default "5" | quote }}
      max_db_connections: {{ .Values.postgresql.pooler.maxDbConnections | default "100" | quote }}
      max_user_connections: {{ .Values.postgresql.pooler.maxUserConnections | default "100" | quote }}

      # Timeouts
      server_idle_timeout: {{ .Values.postgresql.pooler.serverIdleTimeout | default "600" | quote }}
      server_lifetime: {{ .Values.postgresql.pooler.serverLifetime | default "3600" | quote }}
      server_connect_timeout: {{ .Values.postgresql.pooler.serverConnectTimeout | default "15" | quote }}
      query_timeout: {{ .Values.postgresql.pooler.queryTimeout | default "300" | quote }}
      query_wait_timeout: {{ .Values.postgresql.pooler.queryWaitTimeout | default "120" | quote }}

      # Logging
      log_connections: {{ .Values.postgresql.pooler.logConnections | default "1" | quote }}
      log_disconnections: {{ .Values.postgresql.pooler.logDisconnections | default "1" | quote }}

      {{- if .Values.postgresql.pooler.additionalParameters }}
      {{- range $key, $value := .Values.postgresql.pooler.additionalParameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
      {{- end }}

  # Monitoring
  {{- if .Values.postgresql.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  # Template for pooler pods
  template:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        {{- if .Values.postgresql.pooler.resources }}
        resources:
          {{- toYaml .Values.postgresql.pooler.resources | nindent 10 }}
        {{- end }}

        {{- if .Values.postgresql.pooler.securityContext }}
        securityContext:
          {{- toYaml .Values.postgresql.pooler.securityContext | nindent 10 }}
        {{- end }}

      {{- if .Values.postgresql.pooler.affinity }}
      affinity:
        {{- toYaml .Values.postgresql.pooler.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.postgresql.pooler.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.postgresql.pooler.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.postgresql.pooler.tolerations }}
      tolerations:
        {{- toYaml .Values.postgresql.pooler.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
