# HTTPRoutes for Development Environment
# These route traffic from Gateway listeners to backend services

---
# HTTPRoute for ArgoCD
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-argocd
  hostnames:
    - cd.hoodscan.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443

---
# ReferenceGrant to allow cross-namespace access
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-to-gateway
  namespace: argocd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: ""
      kind: Service
      name: argocd-server

---
# HTTPRoute for Monad Indexer Backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monad-indexer-backend
  namespace: monad-indexer-dev
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-monad-indexer
  hostnames:
    - monad-tn1-indexer.hoodscan.io
  rules:
    - backendRefs:
        - name: backend
          port: 4000
