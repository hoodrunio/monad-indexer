{{- if .Values.backendApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend-api
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
  {{- if .Values.backendApi.annotations }}
  annotations:
    {{- toYaml .Values.backendApi.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backendApi.autoscaling.enabled }}
  replicas: {{ .Values.backendApi.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "monad-indexer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-api

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-api/configmap.yaml") . | sha256sum }}
        {{- if .Values.backendApi.podAnnotations }}
        {{- toYaml .Values.backendApi.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "monad-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-api
        {{- if .Values.backendApi.podLabels }}
        {{- toYaml .Values.backendApi.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- include "monad-indexer.imagePullSecrets" . | nindent 6 }}

      serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}

      {{- if .Values.backendApi.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.backendApi.podSecurityContext | nindent 8 }}
      {{- end }}

      initContainers:
        # Wait for PostgreSQL (no migration - API is read-only)
        - name: wait-for-postgres
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              {{- if .Values.postgresql.pooler.enabled }}
              until nc -z {{ include "monad-indexer.fullname" . }}-pooler 5432; do
              {{- else }}
              until nc -z {{ include "monad-indexer.fullname" . }}-postgresql-rw 5432; do
              {{- end }}
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "monad-indexer.fullname" . }}-redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready"
        {{- end }}

      containers:
        - name: backend-api
          image: {{ include "monad-indexer.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - /app/bin/blockscout
          args:
            - start

          ports:
            - name: http
              containerPort: {{ .Values.backendApi.service.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "monad-indexer.fullname" . }}-backend-api-config

          env:
            # Database connection from secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.auth.existingSecret }}
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: uri
                  {{- else }}
                  name: {{ printf "%s-postgresql-app" (include "monad-indexer.fullname" .) }}
                  key: uri
                  {{- end }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | default (printf "%s-backend-secret" (include "monad-indexer.fullname" .)) }}
                  key: secret-key-base
            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "monad-indexer.fullname" . }}-redis
                  key: redis-password
            - name: API_RATE_LIMIT_HAMMER_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/1"
            - name: ACCOUNT_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            {{- end }}
            # API-only mode - disable indexer
            - name: DISABLE_INDEXER
              value: "true"
            {{- if .Values.backendApi.env }}
            {{- range $key, $value := .Values.backendApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.backendApi.extraEnv }}
            {{- toYaml .Values.backendApi.extraEnv | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /api/v2/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /api/v2/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          {{- if .Values.backendApi.resources }}
          resources:
            {{- toYaml .Values.backendApi.resources | nindent 12 }}
          {{- end }}

          {{- if .Values.backendApi.lifecycle }}
          lifecycle:
            {{- toYaml .Values.backendApi.lifecycle | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: dets
              mountPath: /app/dets

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: dets
          emptyDir: {}

      {{- if .Values.backendApi.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.backendApi.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.backendApi.affinity }}
      affinity:
        {{- toYaml .Values.backendApi.affinity | nindent 8 }}
      {{- end }}

      {{- if .Values.backendApi.tolerations }}
      tolerations:
        {{- toYaml .Values.backendApi.tolerations | nindent 8 }}
      {{- end }}

      {{- if .Values.backendApi.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.backendApi.topologySpreadConstraints | nindent 8 }}
      {{- end }}
{{- end }}
