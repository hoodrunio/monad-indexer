# ArgoCD Repository Credentials
# This configures access to the private GitHub repository
#
# IMPORTANT: This file contains sensitive data!
# - DO NOT commit this file with real credentials
# - Use Sealed Secrets or external secrets management in production
# - This is a template - replace <GITHUB_PAT_TOKEN> with your actual token
#
# To apply:
#   1. Replace <GITHUB_PAT_TOKEN> with your GitHub Personal Access Token
#   2. kubectl apply -f argocd/repository-credentials.yaml
#   3. Delete this file or revert the token back to placeholder

apiVersion: v1
kind: Secret
metadata:
  name: monad-indexer-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/hoodrunio/monad-indexer.git
  username: hoodrunio
  password: <GITHUB_PAT_TOKEN>  # Replace with your GitHub PAT
