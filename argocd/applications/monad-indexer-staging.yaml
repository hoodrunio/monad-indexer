# Staging Environment Application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monad-indexer-staging
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: staging-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: staging-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monad-indexer

  source:
    repoURL: https://github.com/your-org/monad-indexer-gitops
    targetRevision: main
    path: charts/monad-indexer
    helm:
      valueFiles:
        - values.yaml
        - environments/values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monad-indexer-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Don't auto-heal in staging (for testing)
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
