# Production Environment Configuration
# Full HA, high resources, all features enabled

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-production-backend-secret"

  replicaCount: 5

  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      memory: "8Gi"

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60  # Aggressive scaling
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  podDisruptionBudget:
    enabled: true
    minAvailable: 3

  env:
    INDEXER_MEMORY_LIMIT: "5"
    LOG_LEVEL: "warn"

  # Topology spread for multi-zone
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: backend

# Microservices - full HA
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 5
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "https://monad.hoodscan.io"
    autoscaling:
      enabled: true
      minReplicas: 5
      maxReplicas: 15
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        cpu: "1000m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

  sig-provider:
    enabled: true
    replicaCount: 3
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  visualizer:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "1Gi"

  stats:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        memory: "4Gi"

# PostgreSQL - production HA
postgresql:
  replicaCount: 3

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-postgresql-app"

  config:
    sharedBuffers: "8GB"
    effectiveCacheSize: "24GB"
    maintenanceWorkMem: "2GB"
    workMem: "128MB"
    maxConnections: "500"

  primary:
    persistence:
      size: 1Ti
      storageClass: "fast-ssd"  # Use high-performance storage
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
      limits:
        memory: "32Gi"

  backup:
    enabled: true
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://monad-indexer-backups/postgresql"

  pooler:
    enabled: true
    replicaCount: 3
    maxClientConn: 5000
    defaultPoolSize: 100

  # Multi-zone distribution
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              cnpg.io/cluster: monad-indexer-postgresql
          topologyKey: topology.kubernetes.io/zone

# Redis - production HA
redis:
  replica:
    replicaCount: 3
  sentinel:
    enabled: true
    quorum: 2
  master:
    persistence:
      size: 100Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: "1000m"
        memory: "4Gi"
      limits:
        memory: "8Gi"
  replica:
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        memory: "4Gi"

# Monitoring - full stack
monitoring:
  enabled: true
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 15s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Network policies - strict
networkPolicies:
  enabled: true
  defaultDeny: true
  enableCiliumPolicies: true  # Enhanced Cilium policies for production

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: indexer.monad.example.com  # Update with your production domain
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: indexer-prod-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 2s
  # Production rate limiting
  rateLimit:
    enabled: true
    requestsPerSecond: 1000
    burst: 2000

# Stats PostgreSQL (if enabled)
statsPostgresql:
  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-production-stats-postgresql-app"

# External Secrets configuration for production environment
externalSecrets:
  enabled: true
  aws:
    secretName: "blockscout-production"  # Separate secret for production
