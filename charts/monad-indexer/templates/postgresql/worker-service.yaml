{{- if and .Values.postgresql.enabled .Values.postgresql.citusWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monad-indexer.fullname" . }}-citus-worker
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: citus-worker
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
    protocol: TCP
  selector:
    {{- include "monad-indexer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: citus-worker
{{- end }}
