{{- range $serviceName, $serviceConfig := .Values.microservices }}
{{- if and $serviceConfig.enabled $serviceConfig.autoscaling.enabled }}
---
apiVersion: {{ include "monad-indexer.hpa.apiVersion" $ }}
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "monad-indexer.fullname" $ }}-{{ $serviceName }}
  labels:
    {{- include "monad-indexer.microservice.labels" $ | nindent 4 }}
    app.kubernetes.io/service: {{ $serviceName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "monad-indexer.fullname" $ }}-{{ $serviceName }}
  minReplicas: {{ $serviceConfig.autoscaling.minReplicas }}
  maxReplicas: {{ $serviceConfig.autoscaling.maxReplicas }}
  metrics:
    {{- if $serviceConfig.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        {{- if semverCompare ">=1.23-0" $.Capabilities.KubeVersion.Version }}
        target:
          type: Utilization
          averageUtilization: {{ $serviceConfig.autoscaling.targetCPUUtilizationPercentage }}
        {{- else }}
        targetAverageUtilization: {{ $serviceConfig.autoscaling.targetCPUUtilizationPercentage }}
        {{- end }}
    {{- end }}
    {{- if $serviceConfig.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        {{- if semverCompare ">=1.23-0" $.Capabilities.KubeVersion.Version }}
        target:
          type: Utilization
          averageUtilization: {{ $serviceConfig.autoscaling.targetMemoryUtilizationPercentage }}
        {{- else }}
        targetAverageUtilization: {{ $serviceConfig.autoscaling.targetMemoryUtilizationPercentage }}
        {{- end }}
    {{- end }}
  {{- if $serviceConfig.autoscaling.behavior }}
  behavior:
    {{- toYaml $serviceConfig.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
