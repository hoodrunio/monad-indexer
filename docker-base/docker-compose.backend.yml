# Core backend indexer and API
services:
  backend:
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    extends:
      file: ./services/backend.yml
      service: backend
    links:
      - db:database
    ports:
      - "4000:4000"
    environment:
      # Monad Testnet RPC
      ETHEREUM_JSONRPC_HTTP_URL: ${ETHEREUM_JSONRPC_HTTP_URL:-https://testnet-rpc.monad.xyz}
      ETHEREUM_JSONRPC_TRACE_URL: ${ETHEREUM_JSONRPC_TRACE_URL:-https://testnet-rpc.monad.xyz}
      ETHEREUM_JSONRPC_WS_URL: ${ETHEREUM_JSONRPC_WS_URL:-wss://testnet-rpc.monad.xyz}
      CHAIN_ID: '10143'
      # Microservices (enabled when microservices compose is included)
      MICROSERVICE_SC_VERIFIER_ENABLED: ${MICROSERVICE_SC_VERIFIER_ENABLED:-false}
      MICROSERVICE_SC_VERIFIER_URL: ${MICROSERVICE_SC_VERIFIER_URL:-http://smart-contract-verifier:8051/}
      MICROSERVICE_SC_VERIFIER_TYPE: ${MICROSERVICE_SC_VERIFIER_TYPE:-sc_verifier}
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: ${MICROSERVICE_VISUALIZE_SOL2UML_ENABLED:-false}
      MICROSERVICE_VISUALIZE_SOL2UML_URL: ${MICROSERVICE_VISUALIZE_SOL2UML_URL:-http://visualizer:8050/}
      MICROSERVICE_SIG_PROVIDER_ENABLED: ${MICROSERVICE_SIG_PROVIDER_ENABLED:-true}
      MICROSERVICE_SIG_PROVIDER_URL: ${MICROSERVICE_SIG_PROVIDER_URL:-http://sig-provider:8050/}
