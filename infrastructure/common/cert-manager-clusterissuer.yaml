---
# Let's Encrypt Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging server for testing (rate limits are higher)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: infra@hoodrun.io
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    # Gateway API HTTP-01 solver (uses Gateway HTTP listener)
    # Supports all environments - cert-manager will use the Gateway in the same namespace as the Certificate
    - http01:
        gatewayHTTPRoute:
          labels:
            acme.cert-manager.io/http01-solver: "true"
          parentRefs:
          # Dev environment
          - name: monad-indexer-gateway
            namespace: monad-indexer-dev
            kind: Gateway
            group: gateway.networking.k8s.io
          # Staging environment (future)
          - name: monad-indexer-gateway
            namespace: monad-indexer-staging
            kind: Gateway
            group: gateway.networking.k8s.io
          # Production environment (future)
          - name: monad-indexer-gateway
            namespace: monad-indexer-prod
            kind: Gateway
            group: gateway.networking.k8s.io

---
# Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production server (rate limited: 50 certificates per registered domain per week)
    server: https://acme-v02.api.letsencrypt.org/directory
    email: infra@hoodrun.io
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    # Gateway API HTTP-01 solver (uses Gateway HTTP listener)
    # Supports all environments - cert-manager will use the Gateway in the same namespace as the Certificate
    - http01:
        gatewayHTTPRoute:
          labels:
            acme.cert-manager.io/http01-solver: "true"
          parentRefs:
          # Dev environment
          - name: monad-indexer-gateway
            namespace: monad-indexer-dev
            kind: Gateway
            group: gateway.networking.k8s.io
          # Staging environment (future)
          - name: monad-indexer-gateway
            namespace: monad-indexer-staging
            kind: Gateway
            group: gateway.networking.k8s.io
          # Production environment (future)
          - name: monad-indexer-gateway
            namespace: monad-indexer-prod
            kind: Gateway
            group: gateway.networking.k8s.io
