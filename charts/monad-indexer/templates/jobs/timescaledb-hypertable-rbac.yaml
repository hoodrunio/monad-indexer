{{- if and .Values.postgresql.enabled .Values.postgresql.timescaledb.enabled .Values.postgresql.timescaledb.setupJob.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "monad-indexer.fullname" . }}-timescaledb-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb-rbac
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
# Allow getting deployment info and annotations
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
  resourceNames: ["{{ include "monad-indexer.fullname" . }}-backend"]

# Allow scaling deployments
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
  resourceNames: ["{{ include "monad-indexer.fullname" . }}-backend"]

# Allow updating deployment annotations
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["patch"]
  resourceNames: ["{{ include "monad-indexer.fullname" . }}-backend"]

# Allow watching and waiting for pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Allow managing HPA for maintenance mode
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "patch"]
  resourceNames: ["{{ include "monad-indexer.fullname" . }}-backend"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monad-indexer.fullname" . }}-timescaledb-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb-rbac
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monad-indexer.fullname" . }}-timescaledb-maintenance
subjects:
- kind: ServiceAccount
  name: {{ include "monad-indexer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
