# TLS Certificates for Gateway
# These certificates are created using HTTP-01 ACME challenges via the Gateway
# Cert-manager will create temporary HTTPRoutes on the Gateway for validation

---
# Certificate for ArgoCD (cd.hoodscan.io)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-gateway-tls
  namespace: monad-indexer-dev
spec:
  secretName: argocd-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cd.hoodscan.io
  usages:
    - digital signature
    - key encipherment

---
# Certificate for Monad Indexer Backend (monad-tn1-indexer.hoodscan.io)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monad-indexer-tls
  namespace: monad-indexer-dev
spec:
  secretName: monad-tn1-indexer-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - monad-tn1-indexer.hoodscan.io
  usages:
    - digital signature
    - key encipherment
