---
# Let's Encrypt Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging server for testing (rate limits are higher)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: infra@hoodrun.io
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    # Gateway API HTTP-01 solver (uses Gateway HTTP listener)
    - http01:
        gatewayHTTPRoute:
          labels:
            acme.cert-manager.io/http01-solver: "true"

---
# Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production server (rate limited: 50 certificates per registered domain per week)
    server: https://acme-v02.api.letsencrypt.org/directory
    email: infra@hoodrun.io
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    # Gateway API HTTP-01 solver (uses Gateway HTTP listener)
    - http01:
        gatewayHTTPRoute:
          labels:
            acme.cert-manager.io/http01-solver: "true"
