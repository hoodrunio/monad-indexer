{{- if and .Values.postgresql.partman.enabled .Values.postgresql.partman.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "monad-indexer.fullname" . }}-pg-partman-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-partman-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.postgresql.partman.migration.timeoutSeconds | default 86400 }}  # 24 hours default
  template:
    metadata:
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: pg-partman-migration
    spec:
      serviceAccountName: {{ include "monad-indexer.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- with .Values.postgresql.partman.migration.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.partman.migration.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: pg-partman-migration
        image: {{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: {{ include "monad-indexer.fullname" . }}-postgresql-rw
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: {{ .Values.postgresql.auth.database | quote }}
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql-app" (include "monad-indexer.fullname" .)) }}
              key: password
        - name: BATCH_SIZE
          value: {{ .Values.postgresql.partman.migration.batchSize | default "50000" | quote }}
        - name: BATCH_INTERVAL
          value: {{ .Values.postgresql.partman.migration.batchInterval | default "10" | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "================================================================"
          echo "PG_PARTMAN DATA MIGRATION JOB"
          echo "================================================================"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Batch size: ${BATCH_SIZE} rows"
          echo "Batch interval: ${BATCH_INTERVAL} seconds"
          echo "================================================================"

          # Function to migrate table data
          migrate_table() {
            local parent_table=$1
            local source_table=$2

            echo ""
            echo ">>> Migrating ${source_table} to ${parent_table}..."

            # Get total row count
            local total_rows=$(psql -t -c "SELECT COUNT(*) FROM ${source_table}" | tr -d ' ')
            echo "Total rows to migrate: ${total_rows}"

            if [[ ${total_rows} -eq 0 ]]; then
              echo "No data to migrate for ${source_table}"
              return 0
            fi

            local start_time=$(date +%s)

            # Use partman.partition_data_proc() for efficient migration
            psql -v ON_ERROR_STOP=1 <<EOF
            DO \$\$
            DECLARE
              v_rows_moved bigint;
              v_total_moved bigint := 0;
              v_batch_count int := 0;
            BEGIN
              LOOP
                -- Migrate data in batches
                SELECT partman.partition_data_proc(
                  p_parent_table := '${parent_table}',
                  p_batch_count := 1,
                  p_batch_interval := ${BATCH_INTERVAL},
                  p_source_table := '${source_table}'
                ) INTO v_rows_moved;

                v_total_moved := v_total_moved + v_rows_moved;
                v_batch_count := v_batch_count + 1;

                -- Log progress every 10 batches
                IF v_batch_count % 10 = 0 THEN
                  RAISE NOTICE 'Batch %: Moved % rows (Total: %)',
                    v_batch_count, v_rows_moved, v_total_moved;
                END IF;

                -- Exit when no more rows to move
                EXIT WHEN v_rows_moved = 0;

                -- Sleep between batches to reduce load
                PERFORM pg_sleep(${BATCH_INTERVAL});
              END LOOP;

              RAISE NOTICE 'Migration complete: % total rows moved in % batches',
                v_total_moved, v_batch_count;
            END \$\$;
EOF

            local end_time=$(date +%s)
            local duration=$((end_time - start_time))

            echo "✓ ${source_table} migration completed in ${duration}s"

            # Verify migration
            local source_count=$(psql -t -c "SELECT COUNT(*) FROM ${source_table}" | tr -d ' ')
            local partition_count=$(psql -t -c "SELECT COUNT(*) FROM ${parent_table}" | tr -d ' ')

            echo "Source remaining: ${source_count}, Partitioned: ${partition_count}"
          }

          # Check database connection
          echo ""
          echo "Testing database connection..."
          psql -c "SELECT version();" > /dev/null || exit 1
          echo "✓ Connected"

          # Verify partitioned tables exist
          echo ""
          echo "Verifying partitioned tables..."
          psql -c "SELECT parent_table FROM partman.part_config;" || exit 1

          # Migrate tables in dependency order
          echo ""
          echo "================================================================"
          echo "STARTING MIGRATION (dependency-ordered)"
          echo "================================================================"

          # Order: independent tables first, then dependent tables
          migrate_table "public.blocks_partitioned" "public.blocks"
          migrate_table "public.transactions_partitioned" "public.transactions"
          migrate_table "public.internal_transactions_partitioned" "public.internal_transactions"
          migrate_table "public.logs_partitioned" "public.logs"
          migrate_table "public.token_transfers_partitioned" "public.token_transfers"

          echo ""
          echo "================================================================"
          echo "MIGRATION COMPLETED SUCCESSFULLY"
          echo "================================================================"
          echo "Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Next steps:"
          echo "1. Verify data consistency with test queries"
          echo "2. Monitor query performance on partitioned tables"
          echo "3. Schedule table swap during maintenance window"
          echo "================================================================"

        resources:
          {{- toYaml .Values.postgresql.partman.migration.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999  # postgres user
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- end }}
