# HTTPRoutes for Development Environment
# These route traffic from Gateway listeners to backend services

---
# HTTPRoute for ArgoCD
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-argocd
  hostnames:
    - cd.hoodscan.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443

---
# ReferenceGrant: Allow ArgoCD HTTPRoute to reference backend Service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-httproute-to-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: ""
      kind: Service
      name: argocd-server

---
# ReferenceGrant: Allow Gateway to reference ArgoCD TLS Secret
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-argocd-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: monad-indexer-dev
  to:
    - group: ""
      kind: Secret
      name: argocd-tls

---
# ReferenceGrant: Allow ArgoCD HTTPRoute to reference Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-httproute-to-gateway
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: monad-indexer-gateway

---
# HTTPRoute for Monad Indexer Backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monad-indexer-backend
  namespace: monad-indexer-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-dev
      sectionName: https-monad-indexer
  hostnames:
    - monad-tn1-indexer.hoodscan.io
  rules:
    - backendRefs:
        - name: backend
          port: 4000
