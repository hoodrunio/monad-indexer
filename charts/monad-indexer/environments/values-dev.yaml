# Development Environment Configuration
# Minimal resources, single replicas, relaxed settings

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-dev-backend-secret"

  replicaCount: 1

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  env:
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
    INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"  # Disable to avoid RPC rate limits
    LOG_LEVEL: "debug"

  config:
    # RPC endpoints with fallback
    rpc:
      httpUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"
      fallbackHttpUrl: "https://testnet-rpc.monad.xyz"
      traceUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"
      fallbackTraceUrl: "https://testnet-rpc.monad.xyz"
      wsUrl: "wss://testnet-rpc.monad.xyz"
      ethCallUrl: "https://lb.drpc.live/monad-testnet/AmQfj8VYakvApG0KMH--gJ8n9WvdvrMR8JFFQmlfqV1j"
      fallbackEthCallUrl: "https://testnet-rpc.monad.xyz"

    api:
      corsAllowedOrigin: "*"

# Disable microservices in dev (optional)
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    config:
      server:
        http:
          cors:
            enabled: true
            allowedOrigin: "*"
    autoscaling:
      enabled: false
  sig-provider:
    enabled: true
    replicaCount: 1
    image:
      tag: "latest"
    config:
      server:
        http:
          cors:
            enabled: false  # Disable CORS - wildcard (*) not supported in :main tag
      metrics:
        enabled: false  # Disable metrics to avoid startup issues
  visualizer:
    enabled: false
  stats:
    enabled: false

# PostgreSQL - minimal for dev
postgresql:
  replicaCount: 1

  # Citus image with PostgreSQL 17 + pg_cron
  image:
    registry: ghcr.io
    repository: hoodrunio/postgresql-citus
    tag: "17-citus13.2"

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-dev-postgresql-app"

  config:
    sharedBuffers: "512MB"
    effectiveCacheSize: "1536MB"
    maintenanceWorkMem: "128MB"
    maxConnections: "100"

  # Citus configuration for dev testing
  citus:
    enabled: true  # Enable Citus distributed features

  primary:
    persistence:
      size: 100Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

  backup:
    enabled: false

  pooler:
    enabled: false  # Disabled for single-node dev
    # CloudNativePG enforces pod anti-affinity even with preferredDuringScheduling
    # Works in production multi-node clusters (tested and verified)

  monitoring:
    enabled: true
    enablePodMonitor: true

  # Disable pod anti-affinity for single-node dev cluster
  affinity:
    enablePodAntiAffinity: false

# Redis - minimal (single master, no replicas for dev)
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  replica:
    replicaCount: 1  # Schema requires minimum 1
  sentinel:
    enabled: false
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Monitoring - enabled for dev
monitoring:
  enabled: true
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 30s

# Network policies - disabled for easier debugging
networkPolicies:
  enabled: false
  enableCiliumPolicies: false

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: monad-mainnet-indexer.hoodscan.io
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: monad-tn1-indexer-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 1s
  
# External Secrets configuration for dev environment
externalSecrets:
  enabled: true
