{{- if and .Values.backendApi.enabled .Values.backendApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "monad-indexer.fullname" . }}-backend-api
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "monad-indexer.fullname" . }}-backend-api
  minReplicas: {{ .Values.backendApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backendApi.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.backendApi.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backendApi.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.backendApi.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.backendApi.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- if .Values.backendApi.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.backendApi.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
