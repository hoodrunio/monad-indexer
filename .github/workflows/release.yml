name: Release - Build and Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment name for approvals"
        required: false
        default: production

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and publish container image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Check registry credentials
        id: registry-check
        run: |
          if [ -z "${{ secrets.REGISTRY_USERNAME }}" ] || [ -z "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Registry credentials not set; skipping image publish."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.registry-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.registry-check.outputs.configured == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.registry-check.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: steps.registry-check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push nft-icon-fetcher image
        if: steps.registry-check.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/nft-icon-fetcher
          file: services/nft-icon-fetcher/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nft-icon-fetcher:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/nft-icon-fetcher:latest
          provenance: true
          sbom: true

      - name: Install cosign
        if: steps.registry-check.outputs.configured == 'true'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image (keyless)
        if: steps.registry-check.outputs.configured == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ env.IMAGE_PREFIX }}/nft-icon-fetcher:${{ github.ref_name }}
          cosign sign --yes ${{ env.IMAGE_PREFIX }}/nft-icon-fetcher:latest
