---
# ArgoCD Application - GatewayClass (Cluster-wide)
# Manages GatewayClass for Cilium

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"  # After Cilium (-4), before environments
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/hoodrunio/monad-indexer.git
    targetRevision: HEAD
    path: infrastructure/common

    # Only sync GatewayClass (cluster-scoped)
    directory:
      include: "gatewayclass.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: default  # GatewayClass is cluster-scoped

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# ArgoCD Application - Gateway Dev Environment
# Manages Gateway, LoadBalancer IP Pool, Certificates, and HTTPRoutes for dev

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # After GatewayClass
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/hoodrunio/monad-indexer.git
    targetRevision: HEAD
    path: infrastructure/environments/dev

    # Sync all environment-specific resources
    directory:
      recurse: false
      include: "*.yaml"

  destination:
    server: https://kubernetes.default.svc
    # Gateway and certificates go to their respective namespaces
    # ArgoCD will respect the namespace specified in each resource

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in status fields (managed by controllers)
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /status
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /status
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
      jsonPointers:
        - /status

