# Development Environment Configuration
# Minimal resources, single replicas, relaxed settings

backend:
  # ExternalSecret will create this secret from AWS Secrets Manager
  existingSecret: "monad-indexer-dev-backend-secret"

  replicaCount: 1

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  env:
    INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
    INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "false"  # Disable to avoid RPC rate limits
    LOG_LEVEL: "debug"

# Disable microservices in dev (optional)
microservices:
  smart-contract-verifier:
    enabled: true
    replicaCount: 1
    autoscaling:
      enabled: false
  sig-provider:
    enabled: true
    replicaCount: 1
    image:
      tag: "v1.1.1"  # Use stable release instead of latest
  visualizer:
    enabled: false
  stats:
    enabled: false

# PostgreSQL - minimal for dev
postgresql:
  replicaCount: 1

  auth:
    # ExternalSecret will create this secret from AWS Secrets Manager
    existingSecret: "monad-indexer-dev-postgresql-app"

  config:
    sharedBuffers: "512MB"
    effectiveCacheSize: "1536MB"
    maintenanceWorkMem: "128MB"
    maxConnections: "100"

  primary:
    persistence:
      size: 100Gi
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "2Gi"

  backup:
    enabled: false

  pooler:
    enabled: false  # Disabled for single-node dev
    # CloudNativePG enforces pod anti-affinity even with preferredDuringScheduling
    # Works in production multi-node clusters (tested and verified)

  monitoring:
    enabled: false
    enablePodMonitor: false

  # Disable pod anti-affinity for single-node dev cluster
  affinity:
    enablePodAntiAffinity: false

# Redis - minimal (single master, no replicas for dev)
redis:
  image:
    tag: "latest"  # Bitnami only supports latest tag now
  replica:
    replicaCount: 1  # Schema requires minimum 1
  sentinel:
    enabled: false
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

# Monitoring - disabled in dev
monitoring:
  enabled: false

# Network policies - disabled for easier debugging
networkPolicies:
  enabled: false
  enableCiliumPolicies: false

# Ingress - DISABLED (using Gateway API)
ingress:
  enabled: false

# Gateway API - Cilium native ingress
gateway:
  enabled: true
  name: "monad-indexer-gateway"
  sectionName: "https-monad-indexer"  # Match the Gateway listener name
  annotations:
    prometheus.io/scrape: "true"
  hosts:
    - host: monad-tn1-indexer.hoodscan.io
      paths:
        - path: /
          pathType: PathPrefix
  tls:
    enabled: true
    secretName: monad-tn1-indexer-tls
    clusterIssuer: letsencrypt-prod
  timeout: 300s
  # retries:  # RequestRetry filter not supported in current Gateway API version
  #   attempts: 3
  #   backoff: 1s

# External Secrets configuration for dev environment
externalSecrets:
  enabled: true
