{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $password := .Values.postgresql.auth.password | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monad-indexer.fullname" . }}-postgresql-app
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.auth.username }}
  password: {{ $password | quote }}
  # Add database URL for application consumption (used by backend)
  # Note: Password is NOT URL-encoded due to Blockscout regex limitations in ConfigHelper
  # The regex pattern in extract_parameters/1 doesn't support URL-encoded chars like %3D
  # See: apps/explorer/lib/explorer/repo/config_helper.ex password pattern
  uri: {{ printf "postgresql://%s:%s@%s-postgresql-rw:5432/%s" .Values.postgresql.auth.username $password (include "monad-indexer.fullname" .) .Values.postgresql.auth.database | quote }}
{{- end }}
