# ArgoCD Application - Kube-Prometheus-Stack
# Provides Prometheus Operator + all CRDs for monitoring

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"  # Install after Cilium, before apps
spec:
  project: infrastructure

  sources:
    # Helm chart from Prometheus Community
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 66.3.1  # Latest stable as of 2024
      chart: kube-prometheus-stack
      helm:
        valueFiles:
          - $values/infrastructure/helm/kube-prometheus-stack/values-production.yaml

    # Values from Git repo
    - repoURL: https://github.com/hoodrunio/monad-indexer.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true  # Required for CRD updates
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in CRDs (managed by Helm)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'
        - '.metadata.annotations["meta.helm.sh/release-name"]'
        - '.metadata.annotations["meta.helm.sh/release-namespace"]'
