name: CI - Build, Lint, and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go fmt/vet/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nft-icon-fetcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/nft-icon-fetcher/go.mod
          cache: true

      - name: Verify formatting
        run: |
          gofmt -l . > /tmp/gofmt.txt
          if [ -s /tmp/gofmt.txt ]; then
            echo "Go files need formatting:"
            cat /tmp/gofmt.txt
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build charts/monad-indexer

      - name: Lint chart
        run: helm lint charts/monad-indexer --with-subcharts

  dockerfiles:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          mapfile -t files < <(find docker services -name Dockerfile)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles found."
            exit 0
          fi
          hadolint "${files[@]}"
