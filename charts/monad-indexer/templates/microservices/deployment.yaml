{{- range $serviceName, $serviceConfig := .Values.microservices }}
{{- if $serviceConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monad-indexer.fullname" $ }}-{{ $serviceName }}
  labels:
    {{- include "monad-indexer.microservice.labels" $ | nindent 4 }}
    app.kubernetes.io/service: {{ $serviceName }}
spec:
  {{- if not $serviceConfig.autoscaling.enabled }}
  replicas: {{ $serviceConfig.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "monad-indexer.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: microservice
      app.kubernetes.io/service: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "monad-indexer.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: microservice
        app.kubernetes.io/service: {{ $serviceName }}
      {{- if $serviceConfig.podAnnotations }}
      annotations:
        {{- toYaml $serviceConfig.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ include "monad-indexer.serviceAccountName" $ }}
      {{- end }}

      {{- if $serviceConfig.podSecurityContext }}
      securityContext:
        {{- toYaml $serviceConfig.podSecurityContext | nindent 8 }}
      {{- end }}

      containers:
      - name: {{ $serviceName }}
        image: {{ $serviceConfig.image.registry }}/{{ $serviceConfig.image.repository }}:{{ $serviceConfig.image.tag }}
        imagePullPolicy: {{ $serviceConfig.image.pullPolicy | default "IfNotPresent" }}

        ports:
        - name: http
          containerPort: {{ $serviceConfig.service.port }}
          protocol: TCP

        envFrom:
        - configMapRef:
            name: {{ include "monad-indexer.fullname" $ }}-{{ $serviceName }}-config
        {{- if eq $serviceName "stats" }}
        {{- if not $serviceConfig.existingSecret }}
        - secretRef:
            name: {{ include "monad-indexer.fullname" $ }}-stats-secret
        {{- end }}
        {{- end }}

        env:
        {{- if eq $serviceName "stats" }}
        {{- if not $serviceConfig.existingSecret }}
        - name: STATS__DB_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "monad-indexer.fullname" $ }}-stats-secret
              key: stats-db-url
        - name: STATS__BLOCKSCOUT_DB_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "monad-indexer.fullname" $ }}-stats-secret
              key: blockscout-db-url
        {{- end }}
        {{- end }}
        {{- if $serviceConfig.env }}
        {{- range $key, $value := $serviceConfig.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}

        {{- if $serviceConfig.livenessProbe }}
        livenessProbe:
          {{- toYaml $serviceConfig.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if $serviceConfig.readinessProbe }}
        readinessProbe:
          {{- toYaml $serviceConfig.readinessProbe | nindent 10 }}
        {{- end }}

        {{- if $serviceConfig.resources }}
        resources:
          {{- toYaml $serviceConfig.resources | nindent 10 }}
        {{- end }}

        {{- if $serviceConfig.containerSecurityContext }}
        securityContext:
          {{- toYaml $serviceConfig.containerSecurityContext | nindent 10 }}
        {{- end }}

      {{- if $serviceConfig.nodeSelector }}
      nodeSelector:
        {{- toYaml $serviceConfig.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if $serviceConfig.affinity }}
      affinity:
        {{- toYaml $serviceConfig.affinity | nindent 8 }}
      {{- end }}

      {{- if $serviceConfig.tolerations }}
      tolerations:
        {{- toYaml $serviceConfig.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
