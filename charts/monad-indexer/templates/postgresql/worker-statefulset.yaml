{{- if and .Values.postgresql.enabled .Values.postgresql.citusWorker.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "monad-indexer.fullname" . }}-citus-worker
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: citus-worker
spec:
  serviceName: {{ include "monad-indexer.fullname" . }}-citus-worker
  replicas: {{ .Values.postgresql.citusWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "monad-indexer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: citus-worker
  template:
    metadata:
      labels:
        {{- include "monad-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: citus-worker
    spec:
      {{- if .Values.postgresql.citusWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.postgresql.citusWorker.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.citusWorker.tolerations }}
      tolerations:
        {{- toYaml .Values.postgresql.citusWorker.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.citusWorker.affinity }}
      affinity:
        {{- toYaml .Values.postgresql.citusWorker.affinity | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 999  # postgres group
        runAsUser: 999  # postgres user
        runAsNonRoot: true
      initContainers:
      # Init container to merge custom config with base config
      - name: config-init
        image: "{{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Preparing PostgreSQL configuration..."

          # Copy base configs if they exist, otherwise create minimal ones
          if [ -f /usr/share/postgresql/postgresql.conf.sample ]; then
            cp /usr/share/postgresql/postgresql.conf.sample /config-merged/postgresql.conf
          else
            touch /config-merged/postgresql.conf
          fi

          # Add shared_preload_libraries at the top (must be set before other params)
          echo "# CITUS CONFIGURATION - AUTO-GENERATED" > /config-merged/postgresql-citus.conf
          echo "shared_preload_libraries = 'citus,pg_cron'" >> /config-merged/postgresql-citus.conf
          echo "" >> /config-merged/postgresql-citus.conf

          # Append custom config
          cat /config-source/postgresql.conf >> /config-merged/postgresql-citus.conf

          # Copy pg_hba.conf
          cp /config-source/pg_hba.conf /config-merged/pg_hba.conf

          echo "Configuration prepared successfully"
        volumeMounts:
        - name: config
          mountPath: /config-source
          readOnly: true
        - name: config-merged
          mountPath: /config-merged
      containers:
      - name: postgres
        image: "{{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
        imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
        command:
        - docker-entrypoint.sh
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql-merged/postgresql-citus.conf
        - -c
        - hba_file=/etc/postgresql-merged/pg_hba.conf
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "monad-indexer.fullname" . }}-postgresql-superuser
              key: password
        - name: POSTGRES_USER
          value: "postgres"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF8 --locale=C"
        # Citus worker configuration via environment
        - name: POSTGRES_DB
          value: "blockscout"
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d/
        - name: config-merged
          mountPath: /etc/postgresql-merged/
          readOnly: true
        resources:
          {{- toYaml .Values.postgresql.citusWorker.resources | nindent 10 }}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          {{- if .Values.postgresql.citusWorker.ephemeralVolumesSizeLimit }}
          {{- if .Values.postgresql.citusWorker.ephemeralVolumesSizeLimit.shm }}
          sizeLimit: {{ .Values.postgresql.citusWorker.ephemeralVolumesSizeLimit.shm }}
          {{- end }}
          {{- end }}
      - name: init-scripts
        configMap:
          name: {{ include "monad-indexer.fullname" . }}-citus-worker-init
          items:
          - key: 01-init-citus.sh
            path: 01-init-citus.sh
            mode: 0755
      - name: config
        configMap:
          name: {{ include "monad-indexer.fullname" . }}-citus-worker-init
          items:
          - key: postgresql.conf
            path: postgresql.conf
          - key: pg_hba.conf
            path: pg_hba.conf
      - name: config-merged
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "monad-indexer.labels" . | nindent 8 }}
        app.kubernetes.io/component: citus-worker
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.postgresql.citusWorker.persistence.storageClass }}
      storageClassName: {{ .Values.postgresql.citusWorker.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.citusWorker.persistence.size }}
{{- end }}
