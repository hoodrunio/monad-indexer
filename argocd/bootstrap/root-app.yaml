# ArgoCD Root Application (App-of-Apps Pattern)
# This is the single application you need to deploy to ArgoCD
# It will automatically create all other applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monad-indexer-root
  namespace: argocd
  # Finalizers ensure proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/monad-indexer-gitops
    targetRevision: main
    path: argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
