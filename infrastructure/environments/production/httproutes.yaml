# HTTPRoutes for Production Environment
# These route traffic from Gateway listeners to backend services

---
# HTTPRoute for ArgoCD (Web UI + CLI)
# Routes both HTTP/1.1 (UI) and HTTP/2 (gRPC CLI) traffic
# Uses header matching to route gRPC traffic (CLI) vs HTTP traffic (UI)
# Gateway API evaluates rules in order, first match wins
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-production
      sectionName: https-argocd
  hostnames:
    - cd.hoodscan.io
  rules:
    # Rule 1: Route gRPC traffic (CLI) based on Content-Type header
    - matches:
        - headers:
            - type: Exact
              name: content-type
              value: application/grpc
      backendRefs:
        - name: argocd-server-grpc
          port: 80
    # Rule 2: Route HTTP traffic (Web UI) - default fallback
    - backendRefs:
        - name: argocd-server-http
          port: 80

---
# HTTPRoute for Monad Indexer Backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monad-indexer-backend
  namespace: monad-indexer-production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: monad-indexer-gateway
      namespace: monad-indexer-production
      sectionName: https-monad-indexer
  hostnames:
    - monad-tn1-indexer.hoodscan.io
  rules:
    - backendRefs:
        - name: backend
          port: 4000
