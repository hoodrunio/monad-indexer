{{- if and .Values.postgresql.enabled .Values.postgresql.timescaledb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monad-indexer.fullname" . }}-timescaledb-setup
  labels:
    {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  timescaledb_setup.sql: |
    -- TimescaleDB Setup Script
    -- This script sets up TimescaleDB extension and configures hypertables
    -- for Monad Blockscout indexer optimized for high-TPS blockchain

    -- Disable statement timeout for long-running migration (77M rows, ~1-2 hours)
    -- This is a safety fallback in case the cluster-level setting is not applied yet
    SET statement_timeout = 0;

    -- Enable TimescaleDB extension
    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

    -- =====================================================
    -- HYPERTABLE SETUP: transactions
    -- =====================================================
    -- Convert transactions table to hypertable
    -- This enables automatic partitioning by time (inserted_at column)
    -- Chunks will be created automatically every 1 day

    DO $$
    BEGIN
        -- Check if transactions table exists and is not already a hypertable
        IF EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'transactions'
        ) AND NOT EXISTS (
            SELECT 1 FROM timescaledb_information.hypertables
            WHERE hypertable_schema = 'public' AND hypertable_name = 'transactions'
        ) THEN
            RAISE NOTICE 'Preparing transactions table for hypertable conversion...';

            -- TimescaleDB requires partitioning column (inserted_at) to be part of all unique indexes
            -- Drop existing constraints that don't include inserted_at
            -- CASCADE is required because foreign keys reference these constraints
            RAISE NOTICE 'Dropping PRIMARY KEY constraint: transactions_pkey (CASCADE)';
            ALTER TABLE transactions DROP CONSTRAINT IF EXISTS transactions_pkey CASCADE;

            RAISE NOTICE 'Dropping UNIQUE constraint/index: transactions_block_hash_index_index';
            -- Drop as constraint first, then as index (in case it exists as either)
            ALTER TABLE transactions DROP CONSTRAINT IF EXISTS transactions_block_hash_index_index;
            DROP INDEX IF EXISTS transactions_block_hash_index_index;

            -- Recreate constraints with inserted_at included
            RAISE NOTICE 'Creating composite PRIMARY KEY: (hash, inserted_at)';
            ALTER TABLE transactions ADD PRIMARY KEY (hash, inserted_at);

            RAISE NOTICE 'Creating composite UNIQUE constraint: (block_hash, index, inserted_at)';
            ALTER TABLE transactions ADD CONSTRAINT transactions_block_hash_index_index
                UNIQUE (block_hash, index, inserted_at);

            -- Add UNIQUE constraint on hash column alone for ON CONFLICT and foreign keys
            RAISE NOTICE 'Creating UNIQUE constraint on hash column for ON CONFLICT support';
            ALTER TABLE transactions ADD CONSTRAINT transactions_hash_unique UNIQUE (hash);

            RAISE NOTICE 'Constraints updated successfully. Proceeding with hypertable conversion...';

            -- Create hypertable
            -- migrate_data => true: converts existing data to chunks (may take 1-2 hours)
            -- chunk_time_interval => 1 day: creates daily partitions
            PERFORM create_hypertable(
                'transactions',
                'inserted_at',
                chunk_time_interval => INTERVAL '1 day',
                migrate_data => true,  -- Migrate existing 77M rows
                if_not_exists => true
            );

            RAISE NOTICE 'Hypertable created: transactions';
            RAISE NOTICE 'Migrating existing data to chunks... This may take 1-2 hours for 86GB';
        ELSE
            RAISE NOTICE 'Hypertable already exists or table not found: transactions';
        END IF;
    END $$;

    -- =====================================================
    -- RESTORE FOREIGN KEYS
    -- =====================================================
    -- Recreate foreign keys that were dropped by CASCADE
    -- These reference the UNIQUE constraint on hash column

    DO $$
    BEGIN
        RAISE NOTICE 'Restoring foreign key constraints...';

        -- logs table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'logs_transaction_hash_fkey'
        ) THEN
            ALTER TABLE logs
                ADD CONSTRAINT logs_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: logs_transaction_hash_fkey';
        END IF;

        -- internal_transactions table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'internal_transactions_transaction_hash_fkey'
        ) THEN
            ALTER TABLE internal_transactions
                ADD CONSTRAINT internal_transactions_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: internal_transactions_transaction_hash_fkey';
        END IF;

        -- token_transfers table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'token_transfers_transaction_hash_fkey'
        ) THEN
            ALTER TABLE token_transfers
                ADD CONSTRAINT token_transfers_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: token_transfers_transaction_hash_fkey';
        END IF;

        -- account_tag_transactions table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'account_tag_transactions_transaction_hash_fkey'
        ) THEN
            ALTER TABLE account_tag_transactions
                ADD CONSTRAINT account_tag_transactions_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: account_tag_transactions_transaction_hash_fkey';
        END IF;

        -- account_watchlist_notifications table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'account_watchlist_notifications_transaction_hash_fkey'
        ) THEN
            ALTER TABLE account_watchlist_notifications
                ADD CONSTRAINT account_watchlist_notifications_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: account_watchlist_notifications_transaction_hash_fkey';
        END IF;

        -- pending_transaction_operations table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'pending_transaction_operations_transaction_hash_fkey'
        ) THEN
            ALTER TABLE pending_transaction_operations
                ADD CONSTRAINT pending_transaction_operations_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: pending_transaction_operations_transaction_hash_fkey';
        END IF;

        -- signed_authorizations table
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE constraint_name = 'signed_authorizations_transaction_hash_fkey'
        ) THEN
            ALTER TABLE signed_authorizations
                ADD CONSTRAINT signed_authorizations_transaction_hash_fkey
                FOREIGN KEY (transaction_hash)
                REFERENCES transactions(hash)
                ON DELETE CASCADE;
            RAISE NOTICE 'Created foreign key: signed_authorizations_transaction_hash_fkey';
        END IF;

        RAISE NOTICE 'All foreign keys restored successfully';
    EXCEPTION
        WHEN OTHERS THEN
            RAISE WARNING 'Error restoring foreign keys: %', SQLERRM;
    END $$;

    -- =====================================================
    -- COMPRESSION POLICY
    -- =====================================================
    -- Compress data older than 7 days to save disk space (5-10x reduction)
    -- Recent data (< 7 days) stays uncompressed for fast INSERT/UPDATE
    -- Compressed data is still queryable but INSERT/UPDATE becomes slower

    DO $$
    BEGIN
        -- Add compression policy
        -- compress_after => 7 days: data older than 7 days will be compressed
        -- segment_by => block_hash: group chunks by block_hash for better compression
        PERFORM add_compression_policy(
            'transactions',
            compress_after => INTERVAL '7 days',
            if_not_exists => true
        );

        -- Enable compression on the hypertable
        ALTER TABLE transactions SET (
            timescaledb.compress,
            timescaledb.compress_segmentby = 'block_hash',
            timescaledb.compress_orderby = 'inserted_at DESC'
        );

        RAISE NOTICE 'Compression policy added: transactions (after 7 days)';
        RAISE NOTICE 'Expected disk savings: 70-90%% (86GB to 8-17GB)';
    EXCEPTION
        WHEN OTHERS THEN
            RAISE WARNING 'Compression policy may already exist or hypertable not ready';
    END $$;

    -- =====================================================
    -- RETENTION POLICY (OPTIONAL - DISABLED BY DEFAULT)
    -- =====================================================
    -- Automatically drop chunks older than 30 days
    -- Uncomment to enable for mainnet with retention requirements

    /*
    DO $$
    BEGIN
        PERFORM add_retention_policy(
            'transactions',
            drop_after => INTERVAL '30 days',
            if_not_exists => true
        );

        RAISE NOTICE 'Retention policy added: transactions (drop after 30 days)';
    END $$;
    */

    -- =====================================================
    -- CONTINUOUS AGGREGATES (OPTIONAL)
    -- =====================================================
    -- Pre-compute common queries for faster API responses
    -- Examples: recent transactions, transaction counts per block

    -- Example: Materialized view for recent transactions (last 1 hour)
    -- This speeds up /api/v2/transactions endpoint significantly
    /*
    CREATE MATERIALIZED VIEW IF NOT EXISTS recent_transactions_1h
    WITH (timescaledb.continuous) AS
    SELECT
        time_bucket('5 minutes', inserted_at) AS bucket,
        block_number,
        COUNT(*) as tx_count,
        MAX(inserted_at) as latest_tx
    FROM transactions
    WHERE inserted_at > NOW() - INTERVAL '1 hour'
    GROUP BY bucket, block_number
    WITH NO DATA;

    -- Refresh policy: update every 1 minute
    SELECT add_continuous_aggregate_policy(
        'recent_transactions_1h',
        start_offset => INTERVAL '2 hours',
        end_offset => INTERVAL '1 minute',
        schedule_interval => INTERVAL '1 minute',
        if_not_exists => true
    );
    */

    -- =====================================================
    -- INDEXES
    -- =====================================================
    -- TimescaleDB automatically creates indexes on time column and chunk boundaries
    -- Additional indexes from Blockscout schema will be preserved
    -- Unused indexes will be dropped by maintenance job

    -- Verify hypertable status
    DO $$
    DECLARE
        chunk_count INTEGER;
        compressed_count INTEGER;
        total_size TEXT;
    BEGIN
        -- Count chunks
        SELECT COUNT(*) INTO chunk_count
        FROM timescaledb_information.chunks
        WHERE hypertable_name = 'transactions';

        -- Count compressed chunks
        SELECT COUNT(*) INTO compressed_count
        FROM timescaledb_information.chunks
        WHERE hypertable_name = 'transactions'
        AND is_compressed = true;

        -- Get total size
        SELECT pg_size_pretty(hypertable_size('transactions')) INTO total_size;

        RAISE NOTICE '============================================';
        RAISE NOTICE 'TimescaleDB Setup Complete!';
        RAISE NOTICE '============================================';
        RAISE NOTICE 'Hypertable: transactions';
        RAISE NOTICE 'Total chunks: %', chunk_count;
        RAISE NOTICE 'Compressed chunks: %', compressed_count;
        RAISE NOTICE 'Total size: %', total_size;
        RAISE NOTICE 'Chunk interval: 1 day';
        RAISE NOTICE 'Compression: After 7 days';
        RAISE NOTICE 'Retention: Disabled (keep all data)';
        RAISE NOTICE '============================================';
        RAISE NOTICE 'Backend queries require NO code changes!';
        RAISE NOTICE 'SELECT * FROM transactions works as before';
        RAISE NOTICE '============================================';
    EXCEPTION
        WHEN OTHERS THEN
            RAISE WARNING 'Could not retrieve hypertable stats (may not be created yet)';
    END $$;

    -- =====================================================
    -- MONITORING QUERIES
    -- =====================================================
    -- Use these queries to monitor TimescaleDB performance

    -- View hypertable info
    -- SELECT * FROM timescaledb_information.hypertables WHERE hypertable_name = 'transactions';

    -- View chunk info
    -- SELECT * FROM timescaledb_information.chunks WHERE hypertable_name = 'transactions' ORDER BY range_end DESC LIMIT 10;

    -- View compression stats
    -- SELECT * FROM timescaledb_information.compression_settings WHERE hypertable_name = 'transactions';

    -- Check chunk sizes
    -- SELECT
    --     chunk_name,
    --     pg_size_pretty(total_bytes) as total_size,
    --     pg_size_pretty(compressed_total_bytes) as compressed_size,
    --     CASE WHEN total_bytes > 0 THEN
    --         ROUND(100.0 * compressed_total_bytes / total_bytes, 2)
    --     ELSE 0 END as compression_ratio
    -- FROM timescaledb_information.chunks
    -- WHERE hypertable_name = 'transactions'
    -- ORDER BY range_end DESC
    -- LIMIT 20;
{{- end }}
