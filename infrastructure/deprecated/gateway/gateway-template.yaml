---
# Gateway - Main ingress gateway for monad-indexer
# This is a TEMPLATE - copy and customize for each environment
#
# For dev: cp gateway-template.yaml gateway-dev.yaml
# For production: cp gateway-template.yaml gateway-production.yaml
#
# Listens on public IP (65.21.183.30) for HTTP and HTTPS traffic

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monad-indexer-gateway
  namespace: NAMESPACE_PLACEHOLDER  # Change to: monad-indexer-dev, monad-indexer-production
  labels:
    gateway: monad-indexer
  annotations:
    # Cilium LoadBalancer pool selector - uses public IP pool
    io.cilium/lb-ipam-ips: "65.21.183.30"
spec:
  gatewayClassName: cilium

  listeners:
    # HTTP listener - redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.hoodscan.io"  # Wildcard for all subdomains
      allowedRoutes:
        namespaces:
          from: Same

    # HTTPS listener - terminates TLS
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "HOSTNAME_PLACEHOLDER"  # Change to: monad-tn1-indexer.hoodscan.io
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: TLS_SECRET_PLACEHOLDER  # Change to: monad-tn1-indexer-tls

  # Address configuration - request public IP from LoadBalancer pool
  addresses:
    - type: IPAddress
      value: "65.21.183.30"
