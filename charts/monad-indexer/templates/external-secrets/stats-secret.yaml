{{- $stats := index .Values.microservices "stats" }}
{{- if and .Values.externalSecrets.enabled $stats.enabled (not $stats.existingSecret) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "monad-indexer.fullname" . }}-stats
  namespace: {{ .Release.Namespace }}
  labels: {{- include "monad-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: stats
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "monad-indexer.fullname" . }}-aws-secrets
    kind: SecretStore
  target:
    name: {{ include "monad-indexer.fullname" . }}-stats-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Stats service database connection URL
        stats-db-url: {{ printf `"postgresql://stats:{{ .STATS_PASSWORD }}@%s-stats-postgresql-rw:5432/stats"` (include "monad-indexer.fullname" .) }}
        # Blockscout main database connection URL (read-only access)
        blockscout-db-url: {{ printf `"postgresql://blockscout:{{ .POSTGRES_PASSWORD }}@%s-postgresql-rw:5432/blockscout"` (include "monad-indexer.fullname" .) }}
  data:
    - secretKey: STATS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName }}
        property: STATS_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.aws.secretName }}
        property: POSTGRES_PASSWORD
{{- end }}
